<!DOCTYPE html>
<html lang="en">
<!--
  example_minimal.html — a tiny annotated Custom HUD.
  Read AI_GUIDE.md in this folder first. This file demonstrates the two kinds of
  fields on the /stream payload:
    1. Core fields    (parsed)  -> read directly:           data.speed
    2. Raw passthrough (untouched) -> read via .Values:     data.pzbActive.Values.Value
  All asset paths are ABSOLUTE because the page is served at /custom-huds/<name>.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Minimal HUD</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg-primary, #11131a); color: var(--text-primary, #e6e9ef);
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    h1 { color: var(--accent-color, #4fc3f7); margin: 4px 0 0; font-size: 1.2rem; }
    .tiles { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .tile {
      min-width: 150px; padding: 16px 20px; text-align: center;
      background: var(--bg-secondary, #1b1f2a); border: 1px solid var(--border-color, #2b3140);
      border-radius: 12px;
    }
    .tile .label { font-size: 0.72rem; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; }
    .tile .value { font-size: 2.4rem; font-weight: 800; line-height: 1.1; }
    .tile .unit  { font-size: 0.8rem; opacity: 0.7; }
    .tile.alert { border-color: #ef5350; color: #ff8a80; }
    pre {
      width: min(900px, 96vw); max-height: 38vh; overflow: auto; margin: 0;
      background: var(--bg-secondary, #1b1f2a); border: 1px solid var(--border-color, #2b3140);
      border-radius: 10px; padding: 12px; font-size: 11px; white-space: pre-wrap; word-break: break-all;
    }
    .hint { font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Example Minimal HUD</h1>

  <div class="tiles">
    <!-- CORE field: read directly -->
    <div class="tile">
      <div class="label">Speed</div>
      <div class="value" id="speed">--</div>
      <div class="unit" id="speedUnit">km/h</div>
    </div>
    <!-- CORE field -->
    <div class="tile">
      <div class="label">Limit</div>
      <div class="value" id="limit">--</div>
    </div>
    <!-- RAW passthrough field (German Safety section). Hidden until valid. -->
    <div class="tile" id="pzbTile" style="display:none;">
      <div class="label">PZB</div>
      <div class="value" id="pzb">--</div>
      <div class="unit" id="pzbSub"></div>
    </div>
  </div>

  <div class="hint">Live <code>/stream</code> payload (every field you can use):</div>
  <pre id="dump">waiting for data…</pre>

  <script>
    // --- helpers for RAW passthrough fields -------------------------------
    // data[key] for a non-Core call is the whole entry { Path, NodeValid, Values }.
    function rawVals(entry) {            // -> Values object, or null if invalid/absent
      return (entry && entry.NodeValid && entry.Values) ? entry.Values : null;
    }
    function prefixVal(obj, prefix) {    // TSW struct keys carry hash suffixes — match by prefix
      if (!obj) return undefined;
      for (var k in obj) if (k.indexOf(prefix) === 0) return obj[k];
    }

    const es = new EventSource('/stream');
    es.onmessage = (event) => {
      const d = JSON.parse(event.data);

      // 1) CORE fields — parsed, read directly.
      document.getElementById('speed').textContent = Math.round(d.speed || 0);
      document.getElementById('limit').textContent = (d.limit != null ? d.limit : '--');
      document.getElementById('speedUnit').textContent = (d.distanceUnits === 'imperial') ? 'mph' : 'km/h';

      // 2) RAW field — interpret here. PZB lives in the "German Safety" section.
      //    pzbActive.Values = { Value: bool }; pzbInfluence.Values.influenceState
      //    has the 2000Hz_Active* flag (= passed a signal at danger).
      const tile = document.getElementById('pzbTile');
      const pzb = rawVals(d.pzbActive);
      if (!pzb) {
        tile.style.display = 'none';                 // not a German loco / call disabled
      } else {
        tile.style.display = '';
        const infl = (rawVals(d.pzbInfluence) || {}).influenceState;
        const danger = prefixVal(infl, '2000Hz_Active') === true;
        tile.classList.toggle('alert', danger);
        document.getElementById('pzb').textContent = danger ? '2000' : (pzb.Value ? 'RDY' : 'OFF');
        document.getElementById('pzbSub').textContent = danger ? 'signal at danger' : '';
      }

      // Debug: show the entire payload so you can see every available field.
      document.getElementById('dump').textContent = JSON.stringify(d, null, 2);
    };
    es.onerror = () => { document.getElementById('dump').textContent = 'stream disconnected — is the app running?'; };
  </script>
</body>
</html>

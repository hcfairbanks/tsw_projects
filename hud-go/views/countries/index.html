<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        /* Nav styles now in theme.css */
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-secondary); }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--accent-color); }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: var(--btn-primary-bg); color: #fff; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-danger { background: var(--btn-danger-bg); color: #fff; }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--accent-color); }
        tbody tr { background: rgba(255, 255, 255, 0.02); }
        tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.04); }
        tr:hover { background: rgba(255, 255, 255, 0.08); }
        .actions { white-space: nowrap; }
        .actions button { padding: 5px 10px; font-size: 12px; }
        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
        #editForm { display: none; }
        #editForm.active { display: block; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button { min-width: 40px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: var(--text-muted); font-size: 14px; }
        .per-page { display: flex; align-items: center; gap: 8px; }
        .per-page select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .add-form { display: flex; gap: 10px; align-items: flex-end; }
        .add-form .form-group { flex: 1; margin-bottom: 0; }
        .add-form .form-group.code { flex: 0 0 100px; }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body data-theme="dark">
    <h1 data-i18n="countries.title">Countries</h1>

    <nav id="main-nav"></nav>

    <div class="card">
        <h2 data-i18n="countries.addNew">Add New Country</h2>
        <form id="addForm" class="add-form">
            <div class="form-group">
                <label for="name" data-i18n="countries.countryName">Country Name:</label>
                <input type="text" id="name" name="name" required placeholder="e.g., United Kingdom" data-i18n-placeholder="countries.namePlaceholder">
            </div>
            <div class="form-group code">
                <label for="code" data-i18n="countries.code">Code *:</label>
                <input type="text" id="code" name="code" required placeholder="e.g., GB" data-i18n-placeholder="countries.codePlaceholder">
            </div>
            <button type="submit" class="btn-primary" data-i18n="common.add">Add</button>
        </form>
    </div>

    <div class="card" id="editForm">
        <h2 data-i18n="countries.editCountry">Edit Country</h2>
        <form id="editFormInner" class="add-form">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="editName" data-i18n="countries.countryName">Country Name:</label>
                <input type="text" id="editName" name="name" required>
            </div>
            <div class="form-group code">
                <label for="editCode" data-i18n="countries.code">Code *:</label>
                <input type="text" id="editCode" name="code" required>
            </div>
            <button type="submit" class="btn-primary" data-i18n="common.save">Save</button>
            <button type="button" class="btn-secondary" onclick="cancelEdit()" data-i18n="common.cancel">Cancel</button>
        </form>
    </div>

    <div class="card">
        <h2 data-i18n="countries.allCountries">All Countries</h2>
        <div id="countriesList">
            <p class="empty-message" data-i18n="countries.loading">Loading countries...</p>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        const API_URL = '/api/countries';
        let allCountries = [];
        let currentPage = 1;
        let currentLimit = 10;

        async function loadCountries() {
            try {
                const response = await fetch(API_URL);
                allCountries = await response.json();
                renderCountries();
            } catch (error) {
                console.error('Error loading countries:', error);
                var errorMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('countries.errorLoading') : 'Error loading countries';
                document.getElementById('countriesList').innerHTML = '<p class="empty-message">' + errorMsg + '</p>';
            }
        }

        // Convert country code to flag icon HTML
        function countryCodeToFlag(code) {
            if (!code || code.length !== 2) return '';
            return '<span class="fi fi-' + code.toLowerCase() + '" style="margin-right: 6px;"></span>';
        }

        function renderCountries(page) {
            page = page || currentPage;
            currentPage = page;
            const container = document.getElementById('countriesList');

            // Helper for safe translation with fallback
            function t(key, fallback) {
                if (typeof i18n !== 'undefined' && i18n.t) {
                    var result = i18n.t(key);
                    return (result !== key) ? result : fallback;
                }
                return fallback;
            }

            if (allCountries.length === 0) {
                container.innerHTML = '<p class="empty-message">' + t('countries.noCountries', 'No countries found.') + '</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            var total = allCountries.length;
            var totalPages = Math.ceil(total / currentLimit);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            var start = (currentPage - 1) * currentLimit;
            var paginated = allCountries.slice(start, start + currentLimit);

            var nameHeader = t('countries.name', 'Name');
            var codeHeader = t('countries.code', 'Code');
            var actionsHeader = t('common.actions', 'Actions');
            var showBtn = t('common.show', 'Show');
            var editBtn = t('common.edit', 'Edit');
            var deleteBtn = t('common.delete', 'Delete');

            let html = '<table><thead><tr><th data-i18n="countries.name">' + nameHeader + '</th><th data-i18n="countries.code">' + codeHeader + '</th><th class="actions" data-i18n="common.actions">' + actionsHeader + '</th></tr></thead><tbody>';
            paginated.forEach(function(c) {
                var flag = countryCodeToFlag(c.code);
                html += '<tr>';
                html += '<td><a href="/countries/' + c.id + '">' + flag + escapeHtml(c.name) + '</a></td>';
                html += '<td>' + escapeHtml(c.code || '') + '</td>';
                html += '<td class="actions">';
                html += '<button class="btn-primary" onclick="showCountry(' + c.id + ')" data-i18n="common.show">' + showBtn + '</button>';
                html += '<button class="btn-secondary" onclick="editCountry(' + c.id + ', \'' + escapeJs(c.name) + '\', \'' + escapeJs(c.code || '') + '\')" data-i18n="common.edit">' + editBtn + '</button>';
                html += '<button class="btn-danger" onclick="deleteCountry(' + c.id + ')" data-i18n="common.delete">' + deleteBtn + '</button>';
                html += '</td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            renderCountriesPagination(total, totalPages);
            if (typeof i18n !== 'undefined') i18n.translatePage();
        }

        function renderCountriesPagination(total, totalPages) {
            var container = document.getElementById('pagination');
            function t(key, fallback) {
                if (typeof i18n !== 'undefined' && i18n.t) {
                    var result = i18n.t(key);
                    return (result !== key) ? result : fallback;
                }
                return fallback;
            }
            var ofText = t('common.of', 'of');
            var showingText = t('common.showing', 'Showing');
            var countriesText = t('countries.countriesCount', 'countries');
            if (totalPages <= 1) {
                container.innerHTML = '<span class="pagination-info">' + showingText + ' ' + total + ' ' + countriesText + '</span>';
                return;
            }
            var html = '<button class="btn-secondary" onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>&laquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>&lsaquo;</button>';
            html += '<span class="pagination-info">' + currentPage + ' ' + ofText + ' ' + totalPages + '</span>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&rsaquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&raquo;</button>';
            html += '<div class="per-page"><select onchange="changeCountriesLimit(this.value)">';
            [10, 25, 50, 100].forEach(function(n) {
                html += '<option value="' + n + '" ' + (currentLimit === n ? 'selected' : '') + '>' + n + '</option>';
            });
            html += '</select></div>';
            container.innerHTML = html;
        }

        function goToPage(page) { renderCountries(page); }
        function changeCountriesLimit(limit) { currentLimit = parseInt(limit); currentPage = 1; renderCountries(1); }

        function showCountry(id) {
            window.location.href = '/countries/' + id;
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeJs(text) {
            return String(text || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        document.getElementById('addForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var name = document.getElementById('name').value.trim();
            var code = document.getElementById('code').value.trim();
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, code: code || null })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add country');
                }
                document.getElementById('name').value = '';
                document.getElementById('code').value = '';
                loadCountries();
            } catch (error) {
                console.error('Error adding country:', error);
                var errMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('countries.errorAdding') : 'Error adding country';
                alert(errMsg + ': ' + error.message);
            }
        });

        function editCountry(id, name, code) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editCode').value = code;
            document.getElementById('editForm').classList.add('active');
            document.getElementById('editName').focus();
        }

        function cancelEdit() {
            document.getElementById('editForm').classList.remove('active');
        }

        document.getElementById('editFormInner').addEventListener('submit', async function(e) {
            e.preventDefault();
            var id = document.getElementById('editId').value;
            var name = document.getElementById('editName').value.trim();
            var code = document.getElementById('editCode').value.trim();
            try {
                await fetch(API_URL + '/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, code: code || null })
                });
                cancelEdit();
                loadCountries();
            } catch (error) {
                console.error('Error updating country:', error);
                var errMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('countries.errorUpdating') : 'Error updating country';
                alert(errMsg);
            }
        });

        async function deleteCountry(id) {
            var confirmMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('countries.confirmDelete') : 'Are you sure you want to delete this country?';
            if (!confirm(confirmMsg)) return;
            try {
                await fetch(API_URL + '/' + id, { method: 'DELETE' });
                loadCountries();
            } catch (error) {
                console.error('Error deleting country:', error);
                var errMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('countries.errorDeleting') : 'Error deleting country';
                alert(errMsg);
            }
        }

        // Theme and color scheme initialization
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', theme);

            var colorScheme = localStorage.getItem('colorScheme');
            if (colorScheme && colorScheme !== 'default') {
                document.body.setAttribute('data-color-scheme', colorScheme);
            }
        })();

    </script>
    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        // Load countries after i18n is initialized
        i18n.init().then(function() {
            loadCountries();
        });
    </script>
</body>
</html>

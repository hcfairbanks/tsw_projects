<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetables - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1900px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        /* Nav styles now in theme.css */
        /* Embedded mode (?embedded=1) — used when this page is iframed inside
           /routes/<id>. Hide everything that's redundant inside the parent
           page (top heading, nav, extract/create/import + extract results
           cards). Keep the search/filter card and the table. */
        body[data-embedded="1"] { padding: 0; background: transparent; max-width: none; }
        body[data-embedded="1"] > h1,
        body[data-embedded="1"] > nav,
        body[data-embedded="1"] > #main-nav,
        body[data-embedded="1"] > .card.dev-only,
        body[data-embedded="1"] > #extractResultsSection { display: none !important; }
        body[data-embedded="1"] .card { margin-bottom: 0; border: none; background: transparent; padding: 0; }
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: var(--btn-primary-bg); color: #fff; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-danger { background: var(--btn-danger-bg); color: #fff; }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--accent-hover); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        th { background: var(--bg-tertiary); color: var(--accent-color); }
        .col-service { width: 8%; }
        .col-service-name { width: 20%; }
        .col-route { width: 15%; }
        .col-section { width: 10%; }
        .col-formations { width: 12%; }
        .col-start-time { width: 7%; }
        .col-duration { width: 7%; }
        .col-stops { width: 5%; }
        .col-coord-source { width: 8%; }
        .col-conductor { width: 8%; }
        tr:hover { background: var(--bg-primary); }
        .actions { white-space: nowrap; }
        .actions button { padding: 5px 10px; font-size: 12px; }
        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
        .filter-box { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .filter-box label { color: var(--text-secondary); white-space: nowrap; }
        .filter-box select, .filter-box input { padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .filter-box select:focus, .filter-box input:focus { outline: none; border-color: var(--accent-color); }
        .filter-box select { min-width: 200px; }
        .filter-box input { flex: 1; min-width: 150px; }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .upload-area { border: 2px dashed var(--border-color); border-radius: 8px; padding: 30px; text-align: center; margin-bottom: 15px; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: var(--accent-color); background: var(--bg-tertiary); }
        .upload-area.dragover { border-color: var(--accent-color); background: var(--bg-tertiary); }
        .upload-area input[type="file"] { display: none; }
        .upload-icon { font-size: 48px; color: var(--border-color); margin-bottom: 10px; }
        .upload-text { color: var(--text-secondary); margin-bottom: 5px; }
        .upload-hint { color: var(--text-muted); font-size: 12px; }
        .upload-status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .upload-status.success { display: block; background: var(--color-success-bg); color: var(--color-success); }
        .upload-status.error { display: block; background: var(--color-error-bg); color: var(--color-error); }
        .upload-status.loading { display: block; background: var(--color-info-bg); color: var(--color-info); }
        .or-divider { color: var(--text-muted); }
        .file-list { margin-top: 15px; text-align: left; }
        .file-item { display: flex; align-items: center; padding: 8px; background: var(--bg-primary); border-radius: 4px; margin-bottom: 5px; }
        .progress-bar { width: 100%; height: 20px; background: var(--bg-tertiary); border-radius: 10px; overflow: hidden; margin-top: 15px; display: none; }
        .progress-bar .fill { height: 100%; background: var(--btn-primary-bg); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; margin-top: 10px; color: var(--text-muted); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .btn-success { background: var(--btn-success-bg); color: #fff; }
        .btn-success:hover { background: var(--btn-success-hover); }
        #extractResultsSection { display: none; }
        #extractResultsSection.visible { display: block; }
        .editable-cell { cursor: pointer; position: relative; }
        .editable-cell:hover { background: var(--bg-tertiary); }
        .editable-cell input { width: 100%; padding: 5px; border: 1px solid var(--accent-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .action-select { padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 12px; min-width: 140px; }
        .action-select:focus { outline: none; border-color: var(--accent-color); }
        .service-name-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 16px; margin-bottom: 15px; }
        .service-name-input:focus { outline: none; border-color: var(--accent-color); }
        .raw-text { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 15px; margin-top: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
        .collapsible { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .collapsible::after { content: '▼'; transition: transform 0.3s; }
        .collapsible.collapsed::after { transform: rotate(-90deg); }
        .collapsible-content { display: block; }
        .collapsible-content.hidden { display: none; }
        .typeahead-container { position: relative; flex: 1; min-width: 150px; }
        .typeahead-container input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .typeahead-container input:focus { outline: none; border-color: var(--accent-color); }
        .typeahead-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 1001; }
        .typeahead-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .typeahead-item:last-child { border-bottom: none; }
        .typeahead-item:hover, .typeahead-item.highlighted { background: var(--bg-tertiary); }
        .typeahead-item .item-name { font-weight: 600; color: var(--text-primary); }
        .typeahead-item .item-sub { font-size: 11px; color: var(--text-muted); }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button { min-width: 40px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: var(--text-muted); font-size: 14px; }
        .per-page { display: flex; align-items: center; gap: 8px; }
        .per-page select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .selected-formation-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-tertiary); padding: 5px 10px; border-radius: 4px; margin-right: 8px; margin-bottom: 8px; font-size: 13px; }
        .selected-formation-tag .remove-formation { background: none; border: none; color: var(--btn-danger-bg); cursor: pointer; font-size: 14px; padding: 0 2px; }
        .selected-formation-tag .remove-formation:hover { color: var(--btn-danger-hover); }
        .filter-country-container { position: relative; width: 200px; flex-shrink: 0; display: inline-block; }
        .country-select-display { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
        .country-select-display:hover { border-color: var(--accent-color); }
        .country-select-display::after { content: '\25BC'; font-size: 10px; color: var(--text-muted); }
        .country-select-display.open::after { content: '\25B2'; }
        .country-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 1002; }
        .country-dropdown.open { display: block; }
        .country-dropdown-item { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); }
        .country-dropdown-item:last-child { border-bottom: none; }
        .country-dropdown-item:hover { background: var(--bg-tertiary); }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background: var(--bg-secondary); }
        th.sortable .sort-arrow { margin-left: 4px; font-size: 10px; color: var(--text-muted); }
        th.sortable.active .sort-arrow { color: var(--accent-color); }
    </style>
</head>
<body data-theme="dark">
    <h1 data-i18n="timetables.title">Timetables</h1>

    <nav id="main-nav"></nav>

    <div class="card dev-only" style="display: none;">
        <h2 data-i18n="timetables.importTimetable">Import Timetable</h2>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">&#128194;</div>
            <div class="upload-text" data-i18n="timetables.dragDropJson">Click to select or drag and drop a JSON file</div>
            <div class="upload-hint" data-i18n="timetables.acceptsJson">Accepts exported timetable JSON files</div>
            <input type="file" id="fileInput" accept=".json" onchange="handleFileSelect(event)">
        </div>
        <div id="uploadStatus" class="upload-status"></div>
    </div>

    <!-- Filter card + paginated results table — rendered by the shared
         TimetableSearch module (also used on /routes/<id>). The .card
         wrapper matches the route page's "Timetables on this Route" panel
         so both pages have the same surrounding chrome. -->
    <div class="card">
        <div id="timetableSearchHost"></div>
    </div>

    <script src="/js/timetable-actions.js"></script>
    <script src="/js/timetable-search.js"></script>
    <script>
        // The filter card + paginated results are owned by TimetableSearch
        // (see /js/timetable-search.js, also used by /routes/<id>). This
        // page only adds the JSON-import flow on top.
        let devMode = false;

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // File upload handling
        function handleFileSelect(event) {
            var file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        async function uploadFile(file) {
            var statusDiv = document.getElementById('uploadStatus');
            statusDiv.className = 'upload-status loading';
            statusDiv.textContent = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('timetables.importingTimetable') : 'Importing timetable...';

            try {
                var content = await readFileAsText(file);
                var jsonData;

                try {
                    jsonData = JSON.parse(content);
                } catch (parseError) {
                    throw new Error('Invalid JSON file');
                }

                // Validate required field - support both old (routeName) and new (serviceName) formats
                if (!jsonData.serviceName && !jsonData.routeName) {
                    throw new Error('Invalid timetable format: missing serviceName or routeName');
                }

                // Import the timetable
                var response = await fetch('/api/timetables/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: content
                });

                if (!response.ok) {
                    var errorData = await response.json();
                    throw new Error(errorData.error || 'Import failed');
                }

                var result = await response.json();

                statusDiv.className = 'upload-status success';
                statusDiv.textContent = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('timetables.importedRedirecting') : 'Imported successfully! Redirecting...';

                // Redirect to the editor after import so the user can tweak.
                setTimeout(function() {
                    window.location.href = '/timetables/' + result.id + '/edit';
                }, 1000);

            } catch (error) {
                statusDiv.className = 'upload-status error';
                statusDiv.textContent = ((typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.error') : 'Error') + ': ' + error.message;
                // Reset file input
                document.getElementById('fileInput').value = '';
            }
        }

        function readFileAsText(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) { resolve(e.target.result); };
                reader.onerror = function() { reject(new Error('Failed to read file')); };
                reader.readAsText(file);
            });
        }

        // Drag and drop handling
        var uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');

            var files = e.dataTransfer.files;
            if (files.length > 0) {
                var file = files[0];
                if (file.name.endsWith('.json')) {
                    uploadFile(file);
                } else {
                    var statusDiv = document.getElementById('uploadStatus');
                    statusDiv.className = 'upload-status error';
                    statusDiv.textContent = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('timetables.errorSelectJsonFile') : 'Error: Please select a JSON file';
                }
            }
        });


        // Theme and color scheme initialization
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', theme);

            var colorScheme = localStorage.getItem('colorScheme');
            if (colorScheme && colorScheme !== 'default') {
                document.body.setAttribute('data-color-scheme', colorScheme);
            }
        })();

    </script>
    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        // The TimetableSearch module owns its own languageChanged handler
        // and re-renders the table on language switch.

        i18n.init().then(function() {
            fetch('/api/config').then(function(r) { return r.json(); }).then(function(config) {
                devMode = config.developmentMode || false;
                if (devMode) {
                    document.querySelectorAll('.dev-only').forEach(function(el) {
                        el.style.display = 'block';
                    });
                    document.body.style.maxWidth = '1900px';
                }
            }).catch(function() {}).then(function() {
                // Bootstrap the shared search module.
                TimetableSearch.init(document.getElementById('timetableSearchHost'), {
                    readUrlParams: true
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TSW HUD - Start</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }
        .status-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-area h1 {
            font-size: 1.6rem;
            color: #4fc3f7;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 1rem;
            color: #aaa;
            min-height: 1.5em;
        }
        .status-text.error {
            color: #ef5350;
        }
        .status-text.success {
            color: #66bb6a;
        }
        #startBtn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #4fc3f7;
            background: linear-gradient(145deg, #1e3a5f, #16213e);
            color: #4fc3f7;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        #startBtn:hover {
            box-shadow: 0 0 50px rgba(79, 195, 247, 0.4);
            transform: scale(1.05);
        }
        #startBtn:active {
            transform: scale(0.95);
            background: linear-gradient(145deg, #16213e, #1e3a5f);
        }
        #startBtn.detecting {
            border-color: #ffa726;
            color: #ffa726;
            animation: pulse 1.5s ease-in-out infinite;
            cursor: default;
        }
        #startBtn.success {
            border-color: #66bb6a;
            color: #66bb6a;
            box-shadow: 0 0 50px rgba(102, 187, 106, 0.4);
        }
        #startBtn.error {
            border-color: #ef5350;
            color: #ef5350;
        }
        #startBtn:disabled {
            cursor: default;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 167, 38, 0.2); }
            50% { box-shadow: 0 0 60px rgba(255, 167, 38, 0.5); }
        }
        .detection-info {
            margin-top: 30px;
            text-align: center;
            min-height: 60px;
        }
        .detection-info .service-name {
            font-size: 1.3rem;
            color: #4fc3f7;
            font-weight: bold;
        }
        .detection-info .route-name {
            font-size: 0.95rem;
            color: #aaa;
            margin-top: 4px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 167, 38, 0.3);
            border-top-color: #ffa726;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-area">
            <h1>TSW Quick Start</h1>
            <div class="status-text" id="statusText">Detecting your service...</div>
        </div>

        <button id="startBtn" onclick="startDetection()">START</button>

        <div class="detection-info">
            <div class="service-name" id="serviceName"></div>
            <div class="route-name" id="routeName"></div>
        </div>
    </div>

    <script>
        var detecting = false;
        var eventSource = null;
        var hudType = new URLSearchParams(window.location.search).get('hud') || 'mobile';

        function setStatus(text, type) {
            var el = document.getElementById('statusText');
            el.textContent = text;
            el.className = 'status-text' + (type ? ' ' + type : '');
        }

        function setBtnState(state) {
            var btn = document.getElementById('startBtn');
            btn.className = '';
            if (state === 'detecting') {
                btn.classList.add('detecting');
                btn.textContent = '';
                btn.disabled = true;
                // Add spinner via innerHTML
                btn.innerHTML = '<span class="spinner"></span>';
            } else if (state === 'success') {
                btn.classList.add('success');
                btn.innerHTML = 'LOADING...';
                btn.disabled = true;
            } else if (state === 'error') {
                btn.classList.add('error');
                btn.innerHTML = 'RETRY';
                btn.disabled = false;
            } else {
                btn.innerHTML = 'START';
                btn.disabled = false;
            }
        }

        function startDetection() {
            if (detecting) return;
            detecting = true;

            setBtnState('detecting');
            setStatus('Connecting to TSW...');
            document.getElementById('serviceName').textContent = '';
            document.getElementById('routeName').textContent = '';

            // Connect to SSE stream to get currentServiceName and GPS
            eventSource = new EventSource('/stream');
            var attempts = 0;
            var maxAttempts = 300; // ~30 seconds at 100ms intervals

            eventSource.onmessage = function(event) {
                attempts++;
                var data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    return;
                }

                // Waiting for TSW connection
                if (data.waiting) {
                    setStatus('Waiting for TSW connection... (' + attempts + ')');
                    if (attempts > maxAttempts) {
                        cleanup();
                        setStatus('Could not connect to TSW. Make sure the game is running.', 'error');
                        setBtnState('error');
                    }
                    return;
                }

                var serviceName = data.currentServiceName;
                var position = data.playerPosition;

                if (!serviceName) {
                    setStatus('Connected to TSW - waiting for service... (' + attempts + ')');
                    if (attempts > maxAttempts) {
                        cleanup();
                        setStatus('No service detected. Start a service in TSW and try again.', 'error');
                        setBtnState('error');
                    }
                    return;
                }

                // We have a service name - try to detect timetable
                setStatus('Service detected: ' + serviceName + ' - looking up timetable...');
                cleanup();

                var detectUrl = '/api/timetables/detect?current_service_name=' + encodeURIComponent(serviceName);
                if (position && position.latitude && position.longitude) {
                    detectUrl += '&lat=' + position.latitude + '&lng=' + position.longitude;
                }

                fetch(detectUrl)
                    .then(function(res) { return res.json(); })
                    .then(function(result) {
                        if (result.found) {
                            setBtnState('success');
                            document.getElementById('serviceName').textContent = serviceName;
                            document.getElementById('routeName').textContent = result.route_name || result.service_name;
                            setStatus('Timetable found! Loading HUD...', 'success');

                            // Redirect to the appropriate HUD with timetable auto-load
                            setTimeout(function() {
                                window.location.href = '/' + hudType + '?timetable=' + result.timetable_id;
                            }, 1000);
                        } else {
                            setStatus('No timetable found for service "' + serviceName + '"', 'error');
                            setBtnState('error');
                        }
                    })
                    .catch(function(err) {
                        setStatus('Error detecting timetable: ' + err.message, 'error');
                        setBtnState('error');
                    });
            };

            eventSource.onerror = function() {
                cleanup();
                setStatus('Connection error. Is the server running?', 'error');
                setBtnState('error');
            };
        }

        function cleanup() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            detecting = false;
        }

        // Auto-start detection on page load
        startDetection();
    </script>
</body>
</html>

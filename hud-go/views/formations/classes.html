<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Classes - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; gap: 12px; align-items: end; margin-bottom: 18px; }
        .filters .field { display: flex; flex-direction: column; }
        .filters label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .filters input, .filters select { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent-color); }
        .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .tile { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: border-color 0.15s; }
        .tile:hover { border-color: var(--accent-color); }
        .tile a { display: block; color: inherit; text-decoration: none; }
        .tile-img { width: 100%; aspect-ratio: 522 / 208; background: var(--bg-tertiary) center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
        .tile-body { padding: 12px 14px; }
        .tile-name { font-weight: 600; font-size: 15px; color: var(--text-primary); margin-bottom: 4px; }
        .tile-meta { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
        .tile-meta .pill { display: inline-block; padding: 1px 7px; border-radius: 3px; background: var(--bg-tertiary); color: var(--text-secondary); margin-right: 6px; }
        .tile-meta .pill.electric { background: rgba(40, 120, 230, 0.18); color: #5aa0ff; }
        .tile-meta .pill.diesel { background: rgba(200, 80, 0, 0.18); color: #ffaa66; }
        .empty-message { text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1 / -1; }
    </style>
</head>
<body data-theme="dark">
    <h1 data-i18n="trainClasses.title">Train Classes</h1>

    <nav id="main-nav"></nav>

    <div class="card">
        <div class="filters">
            <div class="field">
                <label for="q" data-i18n="trainClasses.searchLabel">Search</label>
                <input type="text" id="q" placeholder="Class 483, Acela…">
            </div>
            <div class="field">
                <label for="route" data-i18n="trainClasses.routeLabel">Route</label>
                <select id="route"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="country" data-i18n="trainClasses.countryLabel">Country</label>
                <select id="country"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="category" data-i18n="trainClasses.categoryLabel">Category</label>
                <select id="category"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="propulsion" data-i18n="trainClasses.propulsionLabel">Propulsion</label>
                <select id="propulsion">
                    <option value="">Any</option>
                    <option value="electric">Electric</option>
                    <option value="non-electric">Non-electric</option>
                </select>
            </div>
            <div class="field">
                <label for="voltage" data-i18n="trainClasses.voltageLabel">Voltage</label>
                <select id="voltage"><option value="">Any</option></select>
            </div>
        </div>
        <div style="margin-bottom: 12px;">
            <button id="refreshBtn" type="button" style="padding: 6px 12px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 13px;">Refresh metadata</button>
            <span id="refreshStatus" style="margin-left: 10px; font-size: 12px; color: var(--text-muted);"></span>
        </div>
        <div class="result-count" id="resultCount">Loading…</div>
        <div class="grid" id="grid"></div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        var grid = document.getElementById('grid');
        var resultCount = document.getElementById('resultCount');
        var qInput = document.getElementById('q');
        var routeSelect = document.getElementById('route');
        var countrySelect = document.getElementById('country');
        var categorySelect = document.getElementById('category');
        var propulsionSelect = document.getElementById('propulsion');
        var voltageSelect = document.getElementById('voltage');
        var refreshBtn = document.getElementById('refreshBtn');
        var refreshStatus = document.getElementById('refreshStatus');

        function debounce(fn, ms) {
            var t;
            return function() {
                clearTimeout(t);
                t = setTimeout(fn, ms);
            };
        }

        function escapeHtml(s) {
            if (s == null) return '';
            var d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        function buildQuery() {
            var p = new URLSearchParams();
            if (qInput.value.trim()) p.set('q', qInput.value.trim());
            if (routeSelect.value) p.set('route_id', routeSelect.value);
            if (countrySelect.value) p.set('country_id', countrySelect.value);
            if (categorySelect.value) p.set('category', categorySelect.value);
            if (propulsionSelect.value) p.set('propulsion', propulsionSelect.value);
            if (voltageSelect.value) p.set('voltage_v', voltageSelect.value);
            return p.toString();
        }

        async function loadClasses() {
            grid.innerHTML = '';
            resultCount.textContent = 'Loading…';
            try {
                var qs = buildQuery();
                var res = await fetch('/api/train-classes' + (qs ? '?' + qs : ''));
                if (!res.ok) {
                    resultCount.textContent = 'Error: ' + res.status;
                    return;
                }
                var classes = await res.json();
                resultCount.textContent = classes.length + ' class' + (classes.length === 1 ? '' : 'es');
                if (classes.length === 0) {
                    grid.innerHTML = '<div class="empty-message">No classes match these filters.</div>';
                    return;
                }
                grid.innerHTML = classes.map(function(c) {
                    var thumb = c.thumbnail_path
                        ? '<div class="tile-img" style="background-image: url(\'' + escapeHtml(c.thumbnail_path) + '\');"></div>'
                        : '<div class="tile-img">no image</div>';
                    var pills = [];
                    if (c.is_electric === true) pills.push('<span class="pill electric">Electric</span>');
                    else if (c.is_electric === false) pills.push('<span class="pill diesel">Non-electric</span>');
                    if (c.max_speed_kph) pills.push('<span class="pill">' + Math.round(c.max_speed_kph) + ' kph</span>');
                    if (c.max_power_kw) pills.push('<span class="pill">' + Math.round(c.max_power_kw) + ' kW</span>');
                    var meta = [
                        pills.join(''),
                        c.engine_description ? escapeHtml(c.engine_description) : '',
                        c.manufacturer_name ? '<em style="color: var(--text-muted);">' + escapeHtml(c.manufacturer_name) + '</em>' : ''
                    ].filter(Boolean).join('<br>');
                    return '<div class="tile"><a href="/train-classes/' + c.id + '">' +
                        thumb +
                        '<div class="tile-body">' +
                          '<div class="tile-name">' + escapeHtml(c.name) + '</div>' +
                          '<div class="tile-meta">' + meta + '</div>' +
                        '</div>' +
                    '</a></div>';
                }).join('');
            } catch (e) {
                resultCount.textContent = 'Error: ' + e.message;
            }
        }

        async function populateFilters() {
            // Routes
            try {
                var r = await fetch('/api/routes');
                if (r.ok) {
                    var routes = await r.json();
                    routes.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
                    routes.forEach(function(rt) {
                        var opt = document.createElement('option');
                        opt.value = rt.id;
                        opt.textContent = rt.name;
                        routeSelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Countries
            try {
                var c = await fetch('/api/countries');
                if (c.ok) {
                    var countries = await c.json();
                    countries.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
                    countries.forEach(function(co) {
                        var opt = document.createElement('option');
                        opt.value = co.id;
                        opt.textContent = co.name;
                        countrySelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Voltages
            try {
                var v = await fetch('/api/train-classes/voltages');
                if (v.ok) {
                    var volts = await v.json();
                    volts.forEach(function(n) {
                        var opt = document.createElement('option');
                        opt.value = n;
                        opt.textContent = n >= 1000 ? (n / 1000) + ' kV' : (n + ' V');
                        voltageSelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Vehicle categories
            try {
                var k = await fetch('/api/train-classes/categories');
                if (k.ok) {
                    var cats = await k.json();
                    cats.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s;
                        // Insert spaces before capitals in CamelCase enum
                        // values so "MultipleUnitCar" reads as "Multiple
                        // Unit Car" in the dropdown.
                        opt.textContent = s.replace(/([A-Z])/g, ' $1').trim();
                        categorySelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
        }

        var refresh = debounce(loadClasses, 200);
        qInput.addEventListener('input', refresh);
        routeSelect.addEventListener('change', loadClasses);
        countrySelect.addEventListener('change', loadClasses);
        categorySelect.addEventListener('change', loadClasses);
        propulsionSelect.addEventListener('change', loadClasses);
        voltageSelect.addEventListener('change', loadClasses);

        refreshBtn.addEventListener('click', async function() {
            refreshBtn.disabled = true;
            refreshStatus.textContent = 'Refreshing class metadata from catalog…';
            try {
                var res = await fetch('/api/train-classes/refresh-metadata', { method: 'POST' });
                if (!res.ok) {
                    refreshStatus.textContent = 'Refresh failed: ' + await res.text();
                    return;
                }
                var d = await res.json();
                refreshStatus.textContent = d.classes_with_metadata + ' / ' + d.classes_total +
                    ' classes updated, ' + d.thumbnail_paths_set + ' thumbnail paths set, ' +
                    d.electrification_rows + ' electrification entries.';
                await loadClasses();
            } catch (e) {
                refreshStatus.textContent = 'Error: ' + e.message;
            } finally {
                refreshBtn.disabled = false;
            }
        });

        (async function() {
            await populateFilters();
            await loadClasses();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formations - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        /* Nav styles now in theme.css */
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-secondary); }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--accent-color); }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: var(--btn-primary-bg); color: #fff; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-danger { background: var(--btn-danger-bg); color: #fff; }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--accent-color); }
        tr:hover { background: var(--bg-primary); }
        .actions { white-space: nowrap; }
        .actions button { padding: 5px 10px; font-size: 12px; }
        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
        #editForm { display: none; }
        #editForm.active { display: block; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box input { flex: 1; }
        .filter-box { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .filter-box label { color: var(--text-secondary); white-space: nowrap; }
        .filter-box .typeahead-container { flex: 1; }
        .context-info { background: var(--bg-tertiary); padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; color: var(--text-secondary); }
        .context-info a { color: var(--accent-color); text-decoration: none; }
        .context-info a:hover { text-decoration: underline; }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .typeahead-container { position: relative; flex: 1; }
        .typeahead-container input { width: 100%; }
        .typeahead-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 1001; }
        .typeahead-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .typeahead-item:last-child { border-bottom: none; }
        .typeahead-item:hover, .typeahead-item.highlighted { background: var(--bg-tertiary); }
        .typeahead-item .item-name { font-weight: 600; color: var(--text-primary); }
        .typeahead-item .item-sub { font-size: 11px; color: var(--text-muted); }
        select.form-select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        select.form-select:focus { outline: none; border-color: var(--accent-color); }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button { min-width: 40px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: var(--text-muted); font-size: 14px; }
        .per-page { display: flex; align-items: center; gap: 8px; }
        .per-page select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
    </style>
</head>
<body data-theme="dark">
    <h1 data-i18n="formations.title">Formations</h1>

    <nav id="main-nav"></nav>
    <div class="card">
        <h2 data-i18n="formations.addNew">Add New Formation</h2>
        <form id="addForm">
            <div class="form-group">
                <label for="name" data-i18n="formations.formationName">Formation Name:</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Class 395 Javelin" data-i18n-placeholder="formations.namePlaceholder">
            </div>
            <button type="submit" class="btn-primary" data-i18n="common.add">Add Formation</button>
        </form>
    </div>
    <div class="card" id="editForm">
        <h2 data-i18n="formations.editFormation">Edit Formation</h2>
        <form id="editFormInner">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="editName" data-i18n="formations.formationName">Formation Name *:</label>
                <input type="text" id="editName" name="name" required>
            </div>
            <button type="submit" class="btn-primary" data-i18n="common.save">Save Changes</button>
            <button type="button" class="btn-secondary" onclick="cancelEdit()" data-i18n="common.cancel">Cancel</button>
        </form>
    </div>
    <div class="card">
        <h2 data-i18n="formations.allFormations">Formations</h2>
        <div id="contextInfo" class="context-info" style="display:none;"></div>
        <div class="filter-box">
            <label for="routeFilterInput" data-i18n="formations.filterByRoute">Filter by Route:</label>
            <div class="typeahead-container">
                <input type="text" id="routeFilterInput" placeholder="Type to search routes..." autocomplete="off" data-i18n-placeholder="formations.searchRoutesPlaceholder">
                <div id="routeFilterDropdown" class="typeahead-dropdown"></div>
                <input type="hidden" id="routeFilter" value="">
            </div>
            <button class="btn-secondary" onclick="clearRouteFilter()" data-i18n="common.clear">Clear</button>
        </div>
        <div class="search-box">
            <div class="typeahead-container">
                <input type="text" id="searchInput" placeholder="Type to search formations..." autocomplete="off" data-i18n-placeholder="formations.searchPlaceholder">
                <div id="formationSearchDropdown" class="typeahead-dropdown"></div>
            </div>
            <button class="btn-secondary" onclick="clearSearch()" data-i18n="common.clear">Clear</button>
        </div>
        <div id="formationsList"><p class="empty-message" data-i18n="common.loading">Loading formations...</p></div>
        <div class="pagination" id="pagination"></div>
    </div>
    <script>
        function t(key, fb) { return (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fb; }

        const API_URL = '/api/formations';
        let allFormations = [];
        let currentSearch = '';
        let currentPage = 1;
        let currentLimit = 10;
        let highlightedIndex = -1;
        // Route filter — when non-empty, formations are fetched from
        // /api/routes/{id}/formations so the list is scoped to that route
        // (same data the show-page route filter uses).
        let allRoutes = [];
        let currentRouteId = '';
        let routeHighlightedIndex = -1;

        // Initial URL param: ?route=<id> deep-links to a pre-selected route.
        (function () {
            var qs = new URLSearchParams(window.location.search);
            var rid = qs.get('route');
            if (rid) currentRouteId = rid;
        })();

        async function loadFormations() {
            try {
                var url = currentRouteId
                    ? '/api/routes/' + encodeURIComponent(currentRouteId) + '/formations'
                    : API_URL;
                const response = await fetch(url);
                allFormations = await response.json();
                setupTypeahead();
                renderFormations(1);
            } catch (error) {
                console.error('Error loading formations:', error);
                document.getElementById('formationsList').innerHTML = '<p class="empty-message">' + t('formations.errorLoading', 'Error loading formations') + '</p>';
            }
        }

        async function loadRoutes() {
            try {
                const response = await fetch('/api/routes');
                allRoutes = await response.json();
                setupRouteFilterTypeahead();
                // If ?route=<id> was on the URL, sync the input + context line.
                if (currentRouteId) {
                    var route = allRoutes.find(function (r) { return String(r.id) === String(currentRouteId); });
                    if (route) {
                        document.getElementById('routeFilter').value = route.id;
                        document.getElementById('routeFilterInput').value = route.name;
                        showRouteContext(route);
                    }
                }
            } catch (error) {
                console.error('Error loading routes:', error);
            }
        }

        function setupRouteFilterTypeahead() {
            var input = document.getElementById('routeFilterInput');
            var dropdown = document.getElementById('routeFilterDropdown');
            var hidden = document.getElementById('routeFilter');
            if (!input || input.dataset.wired === '1') return;
            input.dataset.wired = '1';

            input.addEventListener('focus', function () { showRouteDropdown(this.value); });
            input.addEventListener('click', function (e) { e.stopPropagation(); showRouteDropdown(input.value); });
            input.addEventListener('input', function () {
                routeHighlightedIndex = -1;
                hidden.value = '';
                showRouteDropdown(this.value);
            });
            input.addEventListener('keydown', function (e) {
                var items = dropdown.querySelectorAll('.typeahead-item[data-id]');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    routeHighlightedIndex = Math.min(routeHighlightedIndex + 1, items.length - 1);
                    updateRouteHighlight(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    routeHighlightedIndex = Math.max(routeHighlightedIndex - 1, 0);
                    updateRouteHighlight(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (routeHighlightedIndex >= 0 && items[routeHighlightedIndex]) {
                        items[routeHighlightedIndex].click();
                    }
                } else if (e.key === 'Escape') {
                    dropdown.style.display = 'none';
                }
            });
            dropdown.addEventListener('click', function (e) { e.stopPropagation(); });
            document.addEventListener('click', function (e) {
                if (!e.target.closest('#routeFilterInput') && !e.target.closest('#routeFilterDropdown')) {
                    dropdown.style.display = 'none';
                }
            });
        }

        function updateRouteHighlight(items) {
            items.forEach(function (item, idx) {
                item.classList.toggle('highlighted', idx === routeHighlightedIndex);
            });
            if (routeHighlightedIndex >= 0 && items[routeHighlightedIndex]) {
                items[routeHighlightedIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        function showRouteDropdown(filter) {
            var dropdown = document.getElementById('routeFilterDropdown');
            var filterLower = String(filter || '').toLowerCase();

            var filtered = allRoutes.filter(function (r) {
                return String(r.name || '').toLowerCase().includes(filterLower);
            });

            var allRoutesLabel = t('routes.allRoutes', '-- All Routes --');
            var noRoutesLabel = t('routes.noRoutesFound', 'No routes found');

            var html = '<div class="typeahead-item" data-id="" data-name=""><div class="item-name" style="color: var(--text-muted);">' + allRoutesLabel + '</div></div>';
            if (filtered.length === 0) {
                html += '<div class="typeahead-item" style="color: var(--text-muted);">' + noRoutesLabel + '</div>';
            } else {
                html += filtered.slice(0, 50).map(function (r) {
                    return '<div class="typeahead-item" data-id="' + r.id + '" data-name="' + escapeHtml(r.name) + '">' +
                        '<div class="item-name">' + escapeHtml(r.name) + '</div></div>';
                }).join('');
            }
            dropdown.innerHTML = html;

            dropdown.querySelectorAll('.typeahead-item[data-id]').forEach(function (item) {
                item.addEventListener('click', function () {
                    var id = this.dataset.id;
                    var name = this.dataset.name;
                    document.getElementById('routeFilterInput').value = name;
                    document.getElementById('routeFilter').value = id;
                    dropdown.style.display = 'none';
                    applyRouteFilter(id);
                });
            });
            dropdown.style.display = 'block';
        }

        function applyRouteFilter(routeId) {
            currentRouteId = routeId || '';
            currentPage = 1;
            // Sync URL so reloading / sharing preserves the filter.
            var newUrl = currentRouteId
                ? (window.location.pathname + '?route=' + encodeURIComponent(currentRouteId))
                : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
            if (currentRouteId) {
                var route = allRoutes.find(function (r) { return String(r.id) === String(currentRouteId); });
                if (route) showRouteContext(route);
            } else {
                document.getElementById('contextInfo').style.display = 'none';
            }
            loadFormations();
        }

        function showRouteContext(route) {
            var msg = t('formations.showingFormationsOnRoute', 'Showing formations on');
            document.getElementById('contextInfo').style.display = 'block';
            document.getElementById('contextInfo').innerHTML = msg + ' <a href="/routes/' + route.id + '">' + escapeHtml(route.name) + '</a>';
        }

        function clearRouteFilter() {
            document.getElementById('routeFilterInput').value = '';
            document.getElementById('routeFilter').value = '';
            document.getElementById('routeFilterDropdown').style.display = 'none';
            applyRouteFilter('');
        }

        // =============================================
        // Typeahead Setup
        // =============================================
        var formationTypeaheadInitialized = false;
        function setupTypeahead() {
            if (formationTypeaheadInitialized) return; // Prevent duplicate event listeners
            formationTypeaheadInitialized = true;

            var input = document.getElementById('searchInput');
            var dropdown = document.getElementById('formationSearchDropdown');

            // Show dropdown on focus or click
            function showDropdown() {
                showFormationDropdown(input.value);
            }

            input.addEventListener('focus', showDropdown);
            input.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent document click from hiding dropdown
                showDropdown();
            });
            input.addEventListener('input', function() {
                highlightedIndex = -1;
                currentSearch = this.value.trim();
                showFormationDropdown(this.value);
                renderFormations(1);
            });
            input.addEventListener('keydown', function(e) { handleTypeaheadKeydown(e, dropdown); });

            // Prevent clicks inside dropdown from closing it
            dropdown.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            // Hide dropdown on click outside
            document.addEventListener('click', function() {
                dropdown.style.display = 'none';
            });
        }

        function handleTypeaheadKeydown(e, dropdown) {
            var items = dropdown.querySelectorAll('.typeahead-item[data-id]');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
                updateHighlight(items, highlightedIndex);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                highlightedIndex = Math.max(highlightedIndex - 1, 0);
                updateHighlight(items, highlightedIndex);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex >= 0 && items[highlightedIndex]) {
                    items[highlightedIndex].click();
                }
            } else if (e.key === 'Escape') {
                dropdown.style.display = 'none';
            }
        }

        function updateHighlight(items, index) {
            items.forEach(function(item, idx) {
                item.classList.toggle('highlighted', idx === index);
            });
            if (index >= 0 && items[index]) {
                items[index].scrollIntoView({ block: 'nearest' });
            }
        }

        function showFormationDropdown(filter) {
            var dropdown = document.getElementById('formationSearchDropdown');
            var filterLower = String(filter || '').toLowerCase();

            var filtered = allFormations.filter(function(formation) {
                var name = String(formation.name || '');
                return name.toLowerCase().includes(filterLower);
            }).slice(0, 20);

            var noFormationsText = t('formations.noFormations', 'No formations found');
            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="typeahead-item" style="color: var(--text-muted);">' + noFormationsText + '</div>';
            } else {
                dropdown.innerHTML = filtered.map(function(formation) {
                    return '<div class="typeahead-item" data-id="' + formation.id + '" data-name="' + escapeHtml(formation.name) + '">' +
                        '<div class="item-name">' + escapeHtml(formation.name) + '</div></div>';
                }).join('');

                dropdown.querySelectorAll('.typeahead-item[data-id]').forEach(function(item) {
                    item.addEventListener('click', function() {
                        document.getElementById('searchInput').value = this.dataset.name;
                        dropdown.style.display = 'none';
                        currentSearch = this.dataset.name;
                        renderFormations(1);
                    });
                });
            }
            dropdown.style.display = 'block';
        }

        function renderFormations(page) {
            page = page || currentPage;
            currentPage = page;

            const container = document.getElementById('formationsList');
            let formations = allFormations;

            // Filter by search term
            if (currentSearch) {
                const searchLower = String(currentSearch).toLowerCase();
                formations = formations.filter(function(t) {
                    var name = String(t.name || '');
                    return name.toLowerCase().includes(searchLower);
                });
            }

            var total = formations.length;
            var totalPages = Math.ceil(total / currentLimit);
            if (currentPage > totalPages) currentPage = totalPages || 1;

            var start = (currentPage - 1) * currentLimit;
            var paginatedFormations = formations.slice(start, start + currentLimit);

            if (formations.length === 0) {
                container.innerHTML = '<p class="empty-message" data-i18n="formations.noFormations">No formations found.</p>';
                if (typeof i18n !== 'undefined') i18n.translatePage();
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            var nameHeader = t('common.name', 'Name');
            var actionsHeader = t('common.actions', 'Actions');
            var showBtn = t('common.show', 'Show');
            var editBtn = t('common.edit', 'Edit');
            var deleteBtn = t('common.delete', 'Delete');

            let html = '<table><thead><tr><th data-i18n="common.name">' + nameHeader + '</th><th class="actions" data-i18n="common.actions">' + actionsHeader + '</th></tr></thead><tbody>';
            paginatedFormations.forEach(function(t) {
                html += '<tr><td><a href="/formations/' + t.id + '">' + escapeHtml(t.name) + '</a></td>';
                html += '<td class="actions"><button class="btn-primary" onclick="showFormation(' + t.id + ')" data-i18n="common.show">' + showBtn + '</button>';
                html += "<button class=\"btn-secondary\" onclick=\"editFormation(" + t.id + ",'" + escapeJs(t.name) + "')\" data-i18n=\"common.edit\">" + editBtn + "</button>";
                html += '<button class="btn-danger" onclick="deleteFormation(' + t.id + ')" data-i18n="common.delete">' + deleteBtn + '</button></td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            if (typeof i18n !== 'undefined') i18n.translatePage();

            renderPagination(total, totalPages);
        }

        function renderPagination(total, totalPages) {
            var container = document.getElementById('pagination');
            var showingText = t('common.showing', 'Showing');
            var formationsText = t('formations.formations', 'formations');
            var ofText = t('common.of', 'of');
            if (totalPages <= 1) {
                container.innerHTML = '<span class="pagination-info">' + showingText + ' ' + total + ' ' + formationsText + '</span>';
                return;
            }

            var html = '<button class="btn-secondary" onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>&laquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>&lsaquo;</button>';
            html += '<span class="pagination-info">' + currentPage + ' ' + ofText + ' ' + totalPages + '</span>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&rsaquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&raquo;</button>';
            html += '<div class="per-page"><label>&nbsp;</label><select onchange="changeLimit(this.value)">';
            [5, 10, 25, 50].forEach(function(n) {
                html += '<option value="' + n + '" ' + (currentLimit === n ? 'selected' : '') + '>' + n + '</option>';
            });
            html += '</select></div>';
            container.innerHTML = html;
        }

        function goToPage(page) {
            renderFormations(page);
        }

        function changeLimit(limit) {
            currentLimit = parseInt(limit);
            currentPage = 1;
            renderFormations(1);
        }

        function showFormation(id) { window.location.href = '/formations/' + id; }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('formationSearchDropdown').style.display = 'none';
            currentSearch = '';
            currentPage = 1;
            renderFormations(1);
        }

        function escapeHtml(text) { var div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function escapeJs(text) { return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

        document.getElementById('addForm').addEventListener('submit', async function(e) {
            // Let HTML5 validation handle required fields
            if (!this.checkValidity()) {
                e.preventDefault();
                return;
            }

            e.preventDefault();
            var name = document.getElementById('name').value.trim();
            var data = { name: name };
            try {
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.error || t('formations.errorAdding', 'Error adding formation'));
                    return;
                }
                document.getElementById('name').value = '';
                allFormations = [];
                loadFormations();
            } catch (error) { console.error('Error adding formation:', error); alert(t('formations.errorAdding', 'Error adding formation')); }
        });

        function editFormation(id, name) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editForm').classList.add('active');
            document.getElementById('editName').focus();
        }

        function cancelEdit() {
            document.getElementById('editForm').classList.remove('active');
        }

        document.getElementById('editFormInner').addEventListener('submit', async function(e) {
            // Let HTML5 validation handle required fields
            if (!this.checkValidity()) {
                e.preventDefault();
                return;
            }

            e.preventDefault();
            var id = document.getElementById('editId').value;
            var name = document.getElementById('editName').value.trim();
            try {
                const response = await fetch(API_URL + '/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.error || t('formations.errorUpdating', 'Error updating formation'));
                    return;
                }
                cancelEdit();
                loadFormations();
            } catch (error) { console.error('Error updating formation:', error); alert(t('formations.errorUpdating', 'Error updating formation')); }
        });

        async function deleteFormation(id) {
            var confirmMsg = t('formations.confirmDelete', 'Are you sure you want to delete this formation?');
            if (!confirm(confirmMsg)) return;
            try {
                await fetch(API_URL + '/' + id, { method: 'DELETE' });
                loadFormations();
            } catch (error) { console.error('Error deleting formation:', error); alert(t('formations.errorDeleting', 'Error deleting formation')); }
        }

        // Theme and color scheme initialization
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', theme);

            var colorScheme = localStorage.getItem('colorScheme');
            if (colorScheme && colorScheme !== 'default') {
                document.body.setAttribute('data-color-scheme', colorScheme);
            }
        })();

    </script>
    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        // Re-render dynamic content when language changes
        document.addEventListener('languageChanged', function() {
            renderFormations(currentPage);
        });

        // Load data after i18n is initialized. Routes loaded in parallel
        // with formations — the typeahead works once both arrive.
        i18n.init().then(function() {
            loadRoutes();
            loadFormations();
        });
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tsw6-timetable rails viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      padding: 8px 12px;
      background: #111;
      color: #eee;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    header label { font-size: 13px; }
    header input[type=file] { color: #eee; }
    header .stats { margin-left: auto; font-size: 12px; opacity: 0.8; }
    #map { width: 100%; height: 100%; }
    .legend {
      background: rgba(255,255,255,0.92);
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.4;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .legend .swatch {
      display: inline-block;
      width: 18px;
      height: 4px;
      vertical-align: middle;
      margin-right: 6px;
    }
    .stop-marker {
      background: #d62728;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    }
    .platform-label {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 11px;
      font-weight: 500;
      color: #222;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .platform-label::before { display: none; }
    .signal-label {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,80,0,0.3);
      border-radius: 2px;
      padding: 0 3px;
      font-size: 10px;
      color: #1a4d1a;
      white-space: nowrap;
    }
    .signal-label::before { display: none; }
    .switch-label {
      background: rgba(255,235,210,0.9);
      border: 1px solid rgba(140,80,0,0.4);
      border-radius: 2px;
      padding: 0 3px;
      font-size: 10px;
      color: #663300;
      white-space: nowrap;
    }
    .switch-label::before { display: none; }
    .marker-label {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 3px;
      padding: 0 3px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .marker-label::before { display: none; }
    /* Per marker_type styling — colour-codes the small label-tag border. */
    .marker-label.platform-mt { color: #1a5b1a; border-color: rgba(40,140,40,0.55); }
    .marker-label.siding-mt   { color: #774a00; border-color: rgba(180,120,0,0.55); }
    .marker-label.junction-mt { color: #8a1d1d; border-color: rgba(180,40,40,0.55); }
    .marker-label.other-mt    { color: #444;    border-color: rgba(0,0,0,0.25); }
    .cabstop-label {
      background: rgba(225,235,255,0.92);
      border: 1px solid rgba(40,80,180,0.55);
      border-radius: 2px;
      padding: 0 3px;
      font-size: 9px;
      color: #1a3a78;
      white-space: nowrap;
    }
    .cabstop-label::before { display: none; }
    /* Collectable icons — one shape per actor-class category. Used both in
       the legend (inline span) and as the L.divIcon HTML on the map. */
    .collectable-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      font-family: system-ui, sans-serif;
      color: #fff;
      vertical-align: middle;
      margin-right: 4px;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }
    .collectable-robot    { background: #5b6470; }
    .collectable-scarf    { background: #c0392b; }
    .collectable-routemap { background: #2980b9; }
    .collectable-defib    { background: #e74c3c; }
    .collectable-other    { background: #7f8c8d; }
    /* On-map icon (no margin so the divIcon centres correctly). */
    .collectable-pin .collectable-icon { margin-right: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <strong>tsw6 rails viewer</strong>
      <label>
        Map data (<code>&lt;Route&gt;_data.geojson</code>):
        <input type="file" id="railsFile" accept=".geojson,.json" />
      </label>
      <label>
        Import services (<code>&lt;service&gt;.json</code>):
        <input type="file" id="serviceFile" accept=".json" multiple />
      </label>
      <button id="clearServicesBtn" type="button">Clear imports</button>
      <button id="trackBtn" type="button">▶ Track player</button>
      <span id="trackStatus" style="font-size:12px;opacity:0.85"></span>
      <span class="stats" id="stats">No data loaded.</span>
    </header>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const map = L.map('map', { preferCanvas: true }).setView([50.7, -1.2], 12);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <div><span class="swatch" style="background:#0066ff;opacity:0.9"></span>Rail</div>
        <div><span class="swatch" style="background:#ff7f00;opacity:0.85;height:5px"></span>Platform track</div>
        <div><span style="display:inline-block;width:10px;height:10px;background:#2ca02c;border:1px solid #003a00;vertical-align:middle;margin-right:4px;transform:rotate(45deg)"></span>Platform Marker</div>
        <div><span class="swatch" style="background:#17becf;opacity:0.7;height:4px"></span>Line</div>
        <div><span class="swatch" style="background:#9467bd;opacity:0.7;height:4px"></span>Siding</div>
        <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ca02c;border:1px solid #003a00;vertical-align:middle;margin-right:4px"></span>Signal</div>
        <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#cc8400;border:1.5px solid #663300;vertical-align:middle;margin-right:4px"></span>Switch</div>
        <div><span style="display:inline-block;width:8px;height:8px;background:#3f6fd9;border:1.5px solid white;border-radius:50%;vertical-align:middle;margin-right:4px"></span>Cab stop sign</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d62728;border:2px solid white;vertical-align:middle;margin-right:4px"></span>Service stop</div>
        <div style="margin-top:4px;font-weight:600">Collectables</div>
        <div style="margin-left:8px"><span class="collectable-icon collectable-robot">R</span>Delivery Robot</div>
        <div style="margin-left:8px"><span class="collectable-icon collectable-scarf">S</span>Scarf</div>
        <div style="margin-left:8px"><span class="collectable-icon collectable-routemap">M</span>Route Map</div>
        <div style="margin-left:8px"><span class="collectable-icon collectable-defib">+</span>Defibrillator</div>
        <div style="margin-left:8px"><span class="collectable-icon collectable-other">?</span>Other</div>
      `;
      return div;
    };
    legend.addTo(map);

    let railsLayer = null;
    let railsCount = 0;
    let platformCount = 0;
    let signalCount = 0;
    let switchCount = 0;
    let markerCount = 0;
    let cabStopCount = 0;
    let collectableCount = 0;
    // Per-category sub-layers built from the combined data file. Keys match
    // the labels shown in the layer-toggle control.
    let dataSubLayers = {};
    let layerControl = null;
    // Imported per-service files: each one becomes its own layer that can
    // be toggled independently.
    let importedServices = []; // { name, layer }
    let serviceCount = 0;

    function setStats(extra = '') {
      const stats = document.getElementById('stats');
      const parts = [];
      if (railsCount) parts.push(`${railsCount.toLocaleString()} ribbons`);
      if (platformCount) parts.push(`${platformCount.toLocaleString()} platforms`);
      if (signalCount) parts.push(`${signalCount.toLocaleString()} signals`);
      if (switchCount) parts.push(`${switchCount.toLocaleString()} switches`);
      if (markerCount) parts.push(`${markerCount.toLocaleString()} markers`);
      if (cabStopCount) parts.push(`${cabStopCount.toLocaleString()} cab-stops`);
      if (collectableCount) parts.push(`${collectableCount.toLocaleString()} collectables`);
      if (serviceCount) parts.push(`${serviceCount.toLocaleString()} service${serviceCount === 1 ? '' : 's'} imported`);
      if (extra) parts.push(extra);
      stats.textContent = parts.length ? parts.join(' · ') : 'No data loaded.';
    }

    // Track-feature overlay colours: drawn on top of merged rails.
    const TRACK_FEATURE_STYLE = {
      platform_track: { color: '#ff7f00', weight: 5, opacity: 0.85 }, // orange — platforms
      siding_track:   { color: '#9467bd', weight: 4, opacity: 0.7  }, // purple — sidings
      junction_track: { color: '#d62728', weight: 4, opacity: 0.7  }, // red — junctions
      line_track:     { color: '#17becf', weight: 4, opacity: 0.7  }, // teal — lines
      running_track:  { color: '#1f77b4', weight: 4, opacity: 0.7  }, // blue — running
    };

    function styleRibbon(feature) {
      const props = feature.properties || {};
      // Track-feature overlay styling (per structure type).
      if (props.feature_type && TRACK_FEATURE_STYLE[props.feature_type]) {
        return TRACK_FEATURE_STYLE[props.feature_type];
      }
      // Merged rails (one feature with MultiLineString) -> uniform base style.
      if (props.geometry_mode) {
        return { color: '#0066ff', weight: 2, opacity: 0.9 };
      }
      const anchored = props.has_anchor;
      return {
        color: '#0066ff',
        weight: 2,
        opacity: anchored ? 0.9 : 0.5
      };
    }

    function platformLabelText(p) {
      const parts = [];
      if (p.name) parts.push(p.name);
      const sub = [p.structure, p.structure_number].filter(Boolean).join(' ');
      if (sub) parts.push(sub);
      return parts.join(' — ');
    }

    function platformPointToLayer(feature, latlng) {
      const p = feature.properties || {};
      // Schedule-derived platforms (a service actually stops here) get the
      // primary color; tile-only platforms (physically present, never used)
      // get a paler fill so it's clear which ones drive the timetable.
      const fill = p.source === 'tile' ? '#a8a8a8' : '#ff7f00';
      const m = L.circleMarker(latlng, {
        radius: 4,
        color: '#ffffff',
        weight: 1.5,
        fillColor: fill,
        fillOpacity: 1
      });
      const label = platformLabelText(p);
      if (label) {
        m.bindTooltip(label, {
          permanent: true,
          direction: 'right',
          offset: [6, 0],
          className: 'platform-label'
        });
      }
      return m;
    }

    function bindPlatformPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.name) lines.push(`<b>${p.name}</b>`);
      const sub = [p.structure, p.structure_number].filter(Boolean).join(' ');
      if (sub) lines.push(sub);
      if (p.ribbon_guid) lines.push(`<code style="font-size:10px">${p.ribbon_guid.slice(0,18)}…</code>`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    function signalPointToLayer(feature, latlng) {
      const m = L.circleMarker(latlng, {
        radius: 3,
        color: '#003a00',
        weight: 1,
        fillColor: '#2ca02c',
        fillOpacity: 1
      });
      const p = feature.properties || {};
      if (p.display_label) {
        m.bindTooltip(p.display_label, {
          permanent: true,
          direction: 'right',
          offset: [5, 0],
          className: 'signal-label'
        });
      }
      return m;
    }

    function bindSignalPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.display_label) lines.push(`<b>${p.display_label}</b>`);
      if (p.signal_id) lines.push(`Signal ID: <code>${p.signal_id}</code>`);
      if (p.signal_type) lines.push(`Type: ${p.signal_type}`);
      if (p.ribbon_guid) lines.push(`<code style="font-size:10px">${p.ribbon_guid.slice(0,18)}…</code>`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    function switchPointToLayer(feature, latlng) {
      const p = feature.properties || {};
      const m = L.circleMarker(latlng, {
        radius: 4,
        color: '#663300',
        weight: 1.5,
        fillColor: p.manually_controlled ? '#ffaa00' : '#cc8400',
        fillOpacity: 1
      });
      if (p.display_label) {
        m.bindTooltip(p.display_label, {
          permanent: true,
          direction: 'right',
          offset: [6, 0],
          className: 'switch-label'
        });
      }
      return m;
    }

    function bindSwitchPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.display_label) lines.push(`<b>${p.display_label}</b>`);
      if (p.manually_controlled) lines.push('Manually controlled');
      if (p.jct_guid) lines.push(`<code style="font-size:10px">${p.jct_guid.slice(0,18)}…</code>`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    // Track marker (TrackMarkerProperty) — Platform / Siding / Junction / etc.
    // Shape: small diamond (rotated square via L.divIcon).
    const MARKER_STYLE = {
      Platform: { fill: '#2ca02c', edge: '#003a00', cls: 'platform-mt' },
      Siding:   { fill: '#d4a017', edge: '#774a00', cls: 'siding-mt'   },
      Junction: { fill: '#d62728', edge: '#8a1d1d', cls: 'junction-mt' },
    };
    function trackMarkerPointToLayer(feature, latlng) {
      const p = feature.properties || {};
      const style = MARKER_STYLE[p.marker_type] || { fill: '#888', edge: '#222', cls: 'other-mt' };
      // Diamond icon as a 12×12 div rotated 45°, centred on the lat/lng.
      const iconHtml = `<div style="
        width:10px;height:10px;background:${style.fill};
        border:1px solid ${style.edge};transform:rotate(45deg);
        box-shadow:0 0 0 1px rgba(255,255,255,0.6)"></div>`;
      const icon = L.divIcon({
        html: iconHtml,
        className: '',
        iconSize: [12, 12],
        iconAnchor: [6, 6],
      });
      const m = L.marker(latlng, { icon });
      if (p.name) {
        m.bindTooltip(p.name, {
          permanent: true,
          direction: 'right',
          offset: [8, 0],
          className: 'marker-label ' + style.cls,
        });
      }
      return m;
    }
    function bindTrackMarkerPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.name) lines.push(`<b>${p.name}</b>`);
      if (p.marker_type) lines.push(`type: ${p.marker_type}`);
      if (p.line_side) lines.push(`side: ${p.line_side}`);
      if (p.ribbon_guid) lines.push(`<code style="font-size:10px">${p.ribbon_guid.slice(0,18)}…</code>`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    // Cab stop sign — small blue dot with the max-vehicle count label.
    function cabStopSignPointToLayer(feature, latlng) {
      const p = feature.properties || {};
      const m = L.circleMarker(latlng, {
        radius: 3,
        color: '#ffffff',
        weight: 1,
        fillColor: '#3f6fd9',
        fillOpacity: 1
      });
      const n = p.max_rail_vehicles;
      if (Number.isFinite(n) && n > 0) {
        m.bindTooltip(String(n), {
          permanent: true,
          direction: 'right',
          offset: [5, 0],
          className: 'cabstop-label',
        });
      }
      return m;
    }
    function bindCabStopSignPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      const n = p.max_rail_vehicles;
      if (Number.isFinite(n) && n > 0) lines.push(`<b>Cab stop — ${n}-car</b>`);
      else lines.push(`<b>Cab stop sign</b>`);
      if (p.location != null) lines.push(`location: ${(+p.location).toFixed(3)}`);
      if (p.ribbon_guid) lines.push(`<code style="font-size:10px">${p.ribbon_guid.slice(0,18)}…</code>`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    // Map a collectable's actor_class onto a category — one icon per
     // category. Single layer toggle ("Collectables") covers all of them.
    function collectableCategory(actorClass) {
      const c = String(actorClass || '');
      if (c.includes('Robot')) return { label: 'Delivery Robot', cls: 'collectable-robot', sym: 'R' };
      if (c.includes('Scarf')) return { label: 'Scarf', cls: 'collectable-scarf', sym: 'S' };
      if (c.includes('RouteMap')) return { label: 'Route Map', cls: 'collectable-routemap', sym: 'M' };
      if (c.includes('Defibrillator')) return { label: 'Defibrillator', cls: 'collectable-defib', sym: '+' };
      return { label: 'Other', cls: 'collectable-other', sym: '?' };
    }
    function collectablePointToLayer(feature, latlng) {
      const p = feature.properties || {};
      const cat = collectableCategory(p.actor_class);
      const icon = L.divIcon({
        className: 'collectable-pin',
        html: `<span class="collectable-icon ${cat.cls}">${cat.sym}</span>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
      return L.marker(latlng, { icon });
    }
    function bindCollectablePopup(feature, layer) {
      const p = feature.properties || {};
      const cat = collectableCategory(p.actor_class);
      const lines = [`<b>${cat.label}</b>`];
      if (p.actor_class) lines.push(`class: <code>${p.actor_class}</code>`);
      if (p.instance) lines.push(`instance: <code>${p.instance}</code>`);
      if (p.tile) lines.push(`tile: ${p.tile}`);
      if (p.collectable_id) lines.push(`<code style="font-size:10px">${p.collectable_id.slice(0,18)}…</code>`);
      layer.bindPopup(lines.join('<br>'));
    }

    function bindTrackFeaturePopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.location) lines.push(`<b>${p.location}</b>`);
      const sub = [p.structure, p.structure_number].filter(Boolean).join(' ');
      if (sub) lines.push(sub);
      if (p.feature_type) lines.push(`type: ${p.feature_type}`);
      if (p.length_m != null) lines.push(`length: ${p.length_m} m`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    function bindRibbonPopup(feature, layer) {
      const p = feature.properties || {};
      const lines = [];
      if (p.route) lines.push(`<b>${p.route}</b>`);
      if (p.segment_count != null) lines.push(`segments: ${p.segment_count}`);
      if (p.ribbon_count != null) lines.push(`ribbons: ${p.ribbon_count}`);
      if (p.geometry_mode) lines.push(`geometry: ${p.geometry_mode}`);
      // Per-ribbon shape (legacy): also show ribbon detail if present
      if (p.ribbon_guid) lines.push(`<code style="font-size:10px">${p.ribbon_guid}</code>`);
      if (p.length_m != null) lines.push(`length: ${p.length_m} m`);
      if (p.tile) lines.push(`tile: ${p.tile}`);
      if (lines.length) layer.bindPopup(lines.join('<br>'));
    }

    document.getElementById('railsFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const gj = JSON.parse(text);
        // Tear down previous data layers + control
        if (railsLayer) { map.removeLayer(railsLayer); railsLayer = null; }
        for (const k in dataSubLayers) {
          map.removeLayer(dataSubLayers[k]);
        }
        dataSubLayers = {};
        if (layerControl) { map.removeControl(layerControl); layerControl = null; }

        // Split features by category into separate L.LayerGroup so each can
        // be toggled independently in the control.
        // Layer-group whitelist — order here drives the layer-control list.
        // Anything in the GeoJSON file that doesn't map to one of these
        // (junction_track, running_track, junction marker pins, etc.) is
        // simply not surfaced in the viewer. The data still lives in the
        // file for downstream tools.
        const groups = {
          'Rail':            L.layerGroup(),
          'Platform track':  L.layerGroup(),
          'Platform Marker': L.layerGroup(),
          'Line':            L.layerGroup(),
          'Siding':          L.layerGroup(),
          'Signal':          L.layerGroup(),
          'Switch':          L.layerGroup(),
          'Cab stop sign':   L.layerGroup(),
          'Service stop':    L.layerGroup(),
          'Collectables':    L.layerGroup(),
        };
        const MARKER_GROUP = {
          Platform: 'Platform Marker',
        };
        const FT_GROUP = {
          platform_track: 'Platform track',
          siding_track:   'Siding',
          line_track:     'Line',
        };

        railsCount = 0;
        platformCount = 0;
        signalCount = 0;
        switchCount = 0;
        markerCount = 0;
        cabStopCount = 0;
        collectableCount = 0;

        const allBounds = L.latLngBounds();
        for (const f of (gj.features || [])) {
          const p = f.properties || {};
          const t = f.geometry && f.geometry.type;
          let group = null;
          let layer = null;

          if (t === 'Point') {
            const c = f.geometry.coordinates;
            const latlng = L.latLng(c[1], c[0]);
            if (p.feature_kind === 'track_marker') {
              // Only Platform marker pins are kept (per the legend whitelist).
              // Siding / Junction / Other are conveyed by their LineString
              // overlays instead — drop their pins.
              const grp = MARKER_GROUP[p.marker_type];
              if (!grp) continue;
              layer = trackMarkerPointToLayer(f, latlng);
              bindTrackMarkerPopup(f, layer);
              group = grp;
              markerCount += 1;
            } else if (p.feature_kind === 'cab_stop_sign') {
              layer = cabStopSignPointToLayer(f, latlng);
              bindCabStopSignPopup(f, layer);
              group = 'Cab stop sign';
              cabStopCount += 1;
            } else if (p.jct_guid != null) {
              layer = switchPointToLayer(f, latlng);
              bindSwitchPopup(f, layer);
              group = 'Switch';
              switchCount += 1;
            } else if (p.signal_id) {
              layer = signalPointToLayer(f, latlng);
              bindSignalPopup(f, layer);
              group = 'Signal';
              signalCount += 1;
            } else if (p.feature_kind === 'collectable') {
              layer = collectablePointToLayer(f, latlng);
              bindCollectablePopup(f, layer);
              group = 'Collectables';
              collectableCount += 1;
            } else {
              // Unrecognised Point (legacy LinkedPlatform etc.) — not in the
              // whitelist; skip silently.
              continue;
            }
            allBounds.extend(latlng);
          } else if (p.feature_type) {
            // Only known track-feature types are routed; junction_track /
            // running_track and any others are dropped per the legend.
            const grp = FT_GROUP[p.feature_type];
            if (!grp) continue;
            layer = L.geoJSON(f, {
              style: styleRibbon,
              onEachFeature: bindTrackFeaturePopup
            });
            group = grp;
            try { allBounds.extend(layer.getBounds()); } catch (_) {}
          } else {
            layer = L.geoJSON(f, {
              style: styleRibbon,
              onEachFeature: bindRibbonPopup
            });
            group = 'Rail';
            if (p.ribbon_count != null) railsCount += p.ribbon_count;
            else railsCount += 1;
            try { allBounds.extend(layer.getBounds()); } catch (_) {}
          }
          if (layer && group && groups[group]) {
            groups[group].addLayer(layer);
          }
        }

        // Add all groups to the map and to the layer control. Skip empty
        // groups so the toggle doesn't show categories that don't exist on
        // this route.
        const overlays = {};
        for (const [name, g] of Object.entries(groups)) {
          if (g.getLayers().length === 0) continue;
          g.addTo(map);
          dataSubLayers[name] = g;
          overlays[name] = g;
        }
        layerControl = L.control.layers(null, overlays, {
          collapsed: false,
          position: 'bottomleft',
        }).addTo(map);

        // Keep a "rails layer" handle for backward compat (the file picker
        // tear-down above clears all sublayers; this just lets us know
        // something is loaded).
        railsLayer = groups['Rail'].getLayers().length ? groups['Rail'] : null;

        try { if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [20, 20] }); } catch (_) {}
        setStats();
      } catch (err) {
        alert('Failed to load rails GeoJSON: ' + err.message);
      }
    });

    // ---------- Service import (per-service preview) ----------
    const SERVICE_PALETTE = ['#0066ff','#d62728','#9467bd','#17becf','#bcbd22','#e377c2','#8c564b','#7f7f7f'];
    function buildServiceLayer(svc, fallbackName) {
      const lg = L.layerGroup();
      const coords = (svc.coordinates || [])
        .filter(c => Number.isFinite(c.latitude) && Number.isFinite(c.longitude))
        .map(c => [c.latitude, c.longitude]);
      const color = SERVICE_PALETTE[importedServices.length % SERVICE_PALETTE.length];
      if (coords.length >= 2) {
        L.polyline(coords, { color, weight: 4, opacity: 0.75 }).addTo(lg);
      }
      // Stops from timetable[]: one red dot per scheduled stop.
      for (const row of (svc.timetable || [])) {
        const lat = parseFloat(row.latitude);
        const lng = parseFloat(row.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || (lat === 0 && lng === 0)) continue;
        const subParts = [];
        if (row.location) subParts.push(`<b>${row.location}</b>`);
        const sub = [row.structure, row.structure_number].filter(Boolean).join(' ');
        if (sub) subParts.push(sub);
        if (row.arrival) subParts.push(`arr ${row.arrival}`);
        if (row.departure) subParts.push(`dep ${row.departure}`);
        L.circleMarker([lat, lng], {
          radius: 5,
          color: 'white',
          weight: 2,
          fillColor: '#d62728',
          fillOpacity: 1
        }).bindPopup(subParts.join('<br>')).addTo(lg);
      }
      lg.serviceLabel = svc.serviceName || fallbackName;
      lg.serviceColor = color;
      return lg;
    }

    function rebuildLayerControl() {
      if (layerControl) { map.removeControl(layerControl); layerControl = null; }
      const overlays = {};
      for (const [name, g] of Object.entries(dataSubLayers)) overlays[name] = g;
      for (const s of importedServices) {
        overlays[`<span style="border-bottom:3px solid ${s.layer.serviceColor}">${s.name}</span>`] = s.layer;
      }
      layerControl = L.control.layers(null, overlays, {
        collapsed: false,
        position: 'bottomleft',
      }).addTo(map);
    }

    document.getElementById('serviceFile').addEventListener('change', async (e) => {
      const newBounds = L.latLngBounds();
      let added = 0;
      for (const file of e.target.files) {
        try {
          const text = await file.text();
          const svc = JSON.parse(text);
          const layer = buildServiceLayer(svc, file.name);
          if (layer.getLayers().length === 0) continue;
          layer.addTo(map);
          importedServices.push({ name: svc.serviceName || file.name, layer });
          try { newBounds.extend(layer.getBounds()); } catch (_) {}
          added += 1;
        } catch (err) {
          console.error('Failed to load service', file.name, err);
        }
      }
      if (added) {
        serviceCount = importedServices.length;
        rebuildLayerControl();
        try { if (newBounds.isValid()) map.fitBounds(newBounds, { padding: [20, 20] }); } catch (_) {}
      }
      e.target.value = '';
      setStats();
    });

    document.getElementById('clearServicesBtn').addEventListener('click', () => {
      for (const s of importedServices) map.removeLayer(s.layer);
      importedServices = [];
      serviceCount = 0;
      rebuildLayerControl();
      setStats();
    });

    // ---------- Live player tracker ----------
    // Polls /api/playerinfo (server.py forwards to TSW CommAPI). Shows the
    // player's lat/lng as a circle marker. The button toggles polling on/off.
    // Requires the page to be served from server.py (or any same-origin
    // proxy) — opening index.html via file:// will not work because the
    // browser blocks direct calls to localhost:31270 from a file origin.
    const trackBtn      = document.getElementById('trackBtn');
    const trackStatus   = document.getElementById('trackStatus');
    let playerMarker    = null;        // L.CircleMarker for current pos
    let playerHeadingMk = null;        // L.Polyline showing heading
    let playerTrail     = null;        // L.Polyline of recent positions
    const trailCoords   = [];          // list of [lat,lng]
    const TRAIL_MAX     = 600;         // keep last 60s at 10 Hz
    let pollHandle      = null;
    let lastPoll        = 0;
    let followPlayer    = true;        // map auto-pans to the marker
    const POLL_MS       = 250;         // 4 Hz — fast enough for visible motion
                                       // without hammering the API

    function updatePlayerMarker(latlng, headingDegOrNull) {
      if (!playerMarker) {
        playerMarker = L.circleMarker(latlng, {
          radius: 7,
          color: '#ffffff',
          weight: 2,
          fillColor: '#e60023',
          fillOpacity: 1,
        }).addTo(map);
        playerTrail = L.polyline([], { color: '#e60023', weight: 2, opacity: 0.6 }).addTo(map);
      }
      playerMarker.setLatLng(latlng);
      // heading line
      if (headingDegOrNull != null) {
        const rad = headingDegOrNull * Math.PI / 180;
        const lenM = 25;            // 25 m heading indicator
        const dlat = (lenM * Math.cos(rad)) / 111_000;
        const dlng = (lenM * Math.sin(rad)) / (111_000 * Math.cos(latlng.lat * Math.PI/180));
        const tip = L.latLng(latlng.lat + dlat, latlng.lng + dlng);
        if (!playerHeadingMk) {
          playerHeadingMk = L.polyline([latlng, tip], { color: '#e60023', weight: 3 }).addTo(map);
        } else {
          playerHeadingMk.setLatLngs([latlng, tip]);
        }
      }
      trailCoords.push([latlng.lat, latlng.lng]);
      while (trailCoords.length > TRAIL_MAX) trailCoords.shift();
      playerTrail.setLatLngs(trailCoords);
      if (followPlayer) {
        // Recenter only if marker drifted near the edge of the current view
        if (!map.getBounds().pad(-0.2).contains(latlng)) {
          map.panTo(latlng, { animate: true, duration: 0.3 });
        }
      }
    }

    async function pollPlayerInfo() {
      try {
        const r = await fetch('/api/playerinfo', { cache: 'no-store' });
        if (!r.ok) {
          trackStatus.textContent = `tracker: HTTP ${r.status}`;
          return;
        }
        const j = await r.json();
        if (j.Result !== 'Success' || !j.Values) {
          trackStatus.textContent = `tracker: ${j.error || 'no data'}`;
          return;
        }
        const v = j.Values;
        const loc = v.geoLocation;
        if (!loc || typeof loc.latitude !== 'number') {
          trackStatus.textContent = 'tracker: no geoLocation';
          return;
        }
        const latlng = L.latLng(loc.latitude, loc.longitude);
        updatePlayerMarker(latlng, null);
        const tile = v.currentTile ? `tile (${v.currentTile.x},${v.currentTile.y})` : '';
        trackStatus.textContent = `tracker: ${loc.latitude.toFixed(6)}, ${loc.longitude.toFixed(6)}  ${tile}`;
      } catch (e) {
        trackStatus.textContent = `tracker: ${e.message}`;
      }
    }

    function startTracker() {
      if (pollHandle) return;
      pollPlayerInfo();
      pollHandle = setInterval(pollPlayerInfo, POLL_MS);
      trackBtn.textContent = '⏸ Stop tracker';
    }
    function stopTracker() {
      if (pollHandle) { clearInterval(pollHandle); pollHandle = null; }
      trackBtn.textContent = '▶ Track player';
    }
    trackBtn.addEventListener('click', () => {
      if (pollHandle) stopTracker(); else startTracker();
    });
    // Holding the marker centred is helpful while learning the map; click
    // anywhere else to disable auto-follow (panning manually re-enables it
    // on the next poll if the marker leaves the viewport).
    map.on('dragstart', () => { followPlayer = false; });
    map.on('zoomstart', () => { followPlayer = false; });
    map.on('dblclick',  () => { followPlayer = true; });

    setStats();
  </script>
</body>
</html>

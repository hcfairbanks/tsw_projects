<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Classes - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 12px; align-items: end; margin-bottom: 18px; }
        .typeahead-container { position: relative; width: 100%; }
        .typeahead-container input { width: 100%; }
        /* Dropdown extends past the input into the next grid column so long
         * class names aren't truncated. min-width: 200% gives roughly 2 grid
         * cells of width; width: max-content lets it grow further for very
         * long names, capped by max-width. */
        .typeahead-dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 200%; width: max-content; max-width: 520px; max-height: 280px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 1001; }
        .typeahead-item { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); white-space: nowrap; }
        .typeahead-item:last-child { border-bottom: none; }
        .typeahead-item:hover, .typeahead-item.highlighted { background: var(--bg-tertiary); }
        .filters .field { display: flex; flex-direction: column; }
        .filters label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .filters input, .filters select { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent-color); }
        .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .tile { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: border-color 0.15s; }
        .tile:hover { border-color: var(--accent-color); }
        .tile a { display: block; color: inherit; text-decoration: none; }
        .tile-img { width: 100%; aspect-ratio: 522 / 208; background: var(--bg-tertiary) center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
        .tile-body { padding: 12px 14px; }
        .tile-name { font-weight: 600; font-size: 15px; color: var(--text-primary); margin-bottom: 4px; }
        .tile-meta { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
        .tile-meta .pill { display: inline-block; padding: 1px 7px; border-radius: 3px; background: var(--bg-tertiary); color: var(--text-secondary); margin-right: 6px; }
        .tile-meta .pill.electric { background: rgba(40, 120, 230, 0.18); color: #5aa0ff; }
        .tile-meta .pill.diesel { background: rgba(200, 80, 0, 0.18); color: #ffaa66; }
        .empty-message { text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1 / -1; }
        .pagination button { min-width: 40px; padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: var(--bg-tertiary); color: var(--text-primary); }
        .pagination button:hover:not(:disabled) { background: var(--accent-hover); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination button.active { background: var(--btn-primary-bg); color: #fff; }
        .pagination-info { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body data-theme="dark">
    <h1 data-i18n="trainClasses.title">Train Classes</h1>

    <nav id="main-nav"></nav>

    <div class="card">
        <div class="filters">
            <div class="field">
                <label for="q" data-i18n="trainClasses.searchLabel">Class</label>
                <div class="typeahead-container">
                    <input type="text" id="q" placeholder="Type to search train classes..." autocomplete="off">
                    <div id="qDropdown" class="typeahead-dropdown"></div>
                </div>
            </div>
            <div class="field">
                <label for="route" data-i18n="trainClasses.routeLabel">Route</label>
                <select id="route"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="country" data-i18n="trainClasses.countryLabel">Country</label>
                <select id="country"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="type">Type</label>
                <select id="type"><option value="">All</option></select>
            </div>
            <div class="field">
                <label for="voltage" data-i18n="trainClasses.voltageLabel">Voltage</label>
                <select id="voltage"><option value="">Any</option></select>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;">
            <span id="refreshStatus" style="font-size: 12px; color: var(--text-muted);"></span>
            <div style="flex: 1;"></div>
            <button id="refreshBtn" type="button" style="padding: 6px 12px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 13px;">Refresh metadata</button>
            <button id="clearBtn" type="button" class="btn-secondary" style="padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: var(--bg-tertiary); color: var(--text-primary);">Clear</button>
            <button id="searchBtn" type="button" class="btn-primary" style="padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: var(--btn-primary-bg); color: #fff;">Search</button>
        </div>
        <div class="result-count" id="resultCount">Loading…</div>
        <div class="grid" id="grid"></div>
        <div class="pagination" id="pagination" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap;"></div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        var grid = document.getElementById('grid');
        var resultCount = document.getElementById('resultCount');
        var pagination = document.getElementById('pagination');
        var qInput = document.getElementById('q');
        var qDropdown = document.getElementById('qDropdown');
        var routeSelect = document.getElementById('route');
        var countrySelect = document.getElementById('country');
        var typeSelect = document.getElementById('type');
        var voltageSelect = document.getElementById('voltage');
        var searchBtn = document.getElementById('searchBtn');
        var clearBtn = document.getElementById('clearBtn');
        var refreshBtn = document.getElementById('refreshBtn');
        var refreshStatus = document.getElementById('refreshStatus');

        var currentPage = 1;
        var pageLimit = 24;
        var qHighlight = -1;

        function escapeHtml(s) {
            if (s == null) return '';
            var d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        function buildQuery(page) {
            var p = new URLSearchParams();
            if (qInput.value.trim()) p.set('q', qInput.value.trim());
            if (routeSelect.value) p.set('route_id', routeSelect.value);
            if (countrySelect.value) p.set('country_id', countrySelect.value);
            if (typeSelect.value) p.set('type', typeSelect.value);
            if (voltageSelect.value) p.set('voltage_v', voltageSelect.value);
            p.set('page', page || currentPage);
            p.set('limit', pageLimit);
            return p.toString();
        }

        // ---- class-name typeahead ----
        // Hits /api/train-classes?q= (bare-array shape — no page param) so the
        // server's LIKE search drives the suggestions. Debounced so each
        // keystroke isn't a request. Selecting an item commits the exact
        // name and triggers a page-1 search.
        var qSearchTimer = null;
        var qSearchToken = 0;
        function scheduleQSearch() {
            clearTimeout(qSearchTimer);
            qSearchToken++;
            var myToken = qSearchToken;
            qSearchTimer = setTimeout(function() { runQSearch(myToken); }, 150);
        }
        async function runQSearch(myToken) {
            var q = qInput.value.trim();
            // Quiet placeholder so the dropdown isn't empty while the
            // request is in flight (matches the timetable typeahead UX).
            if (!qDropdown.innerHTML.trim() || qDropdown.style.display !== 'block') {
                qDropdown.innerHTML = '<div class="typeahead-item" style="color: var(--text-muted); cursor: default;">…</div>';
                qDropdown.style.display = 'block';
            }
            try {
                var url = '/api/train-classes' + (q ? '?q=' + encodeURIComponent(q) : '');
                var res = await fetch(url);
                if (myToken !== qSearchToken) return;
                if (!res.ok) { qDropdown.style.display = 'none'; return; }
                var items = await res.json();
                items = Array.isArray(items) ? items : (items.data || []);
                items = items.slice(0, 15);
                if (!items.length) {
                    qDropdown.innerHTML = '<div class="typeahead-item" style="color: var(--text-muted); cursor: default;">No matches</div>';
                    qDropdown.style.display = 'block';
                    return;
                }
                qHighlight = -1;
                qDropdown.innerHTML = items.map(function(c, i) {
                    return '<div class="typeahead-item" data-name="' + escapeHtml(c.name) + '" data-i="' + i + '">' + escapeHtml(c.name) + '</div>';
                }).join('');
                qDropdown.style.display = 'block';
                qDropdown.querySelectorAll('.typeahead-item[data-name]').forEach(function(it) {
                    it.addEventListener('click', function() {
                        qInput.value = this.dataset.name;
                        qDropdown.style.display = 'none';
                        loadClasses(1);
                    });
                });
            } catch (e) { qDropdown.style.display = 'none'; }
        }
        qInput.addEventListener('input', scheduleQSearch);
        // Clicking into the field always shows suggestions — empty input
        // returns the first 15 classes; non-empty returns LIKE matches.
        qInput.addEventListener('focus', function() {
            qSearchToken++;
            runQSearch(qSearchToken);
        });
        qInput.addEventListener('keydown', function(e) {
            var items = qDropdown.querySelectorAll('.typeahead-item[data-name]');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                qHighlight = Math.min(qHighlight + 1, items.length - 1);
                updateQHighlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                qHighlight = Math.max(qHighlight - 1, 0);
                updateQHighlight(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (qHighlight >= 0 && items[qHighlight]) {
                    qInput.value = items[qHighlight].dataset.name;
                }
                qDropdown.style.display = 'none';
                loadClasses(1);
            } else if (e.key === 'Escape') {
                qDropdown.style.display = 'none';
            }
        });
        function updateQHighlight(items) {
            items.forEach(function(it, i) { it.classList.toggle('highlighted', i === qHighlight); });
            if (qHighlight >= 0 && items[qHighlight]) items[qHighlight].scrollIntoView({ block: 'nearest' });
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.typeahead-container')) qDropdown.style.display = 'none';
        });

        async function loadClasses(page) {
            if (page) currentPage = page;
            grid.innerHTML = '';
            pagination.innerHTML = '';
            resultCount.textContent = 'Loading…';
            try {
                var qs = buildQuery(currentPage);
                var res = await fetch('/api/train-classes' + (qs ? '?' + qs : ''));
                if (!res.ok) {
                    resultCount.textContent = 'Error: ' + res.status;
                    return;
                }
                var payload = await res.json();
                var classes = Array.isArray(payload) ? payload : (payload.data || []);
                var pag = payload.pagination || { total: classes.length, page: 1, totalPages: 1, limit: classes.length };
                var startIdx = (pag.page - 1) * pag.limit;
                resultCount.textContent = pag.total === 0
                    ? '0 classes'
                    : ((startIdx + 1) + '–' + (startIdx + classes.length) + ' of ' + pag.total + ' class' + (pag.total === 1 ? '' : 'es'));
                renderPagination(pag);
                if (classes.length === 0) {
                    grid.innerHTML = '<div class="empty-message">No classes match these filters.</div>';
                    return;
                }
                grid.innerHTML = classes.map(function(c) {
                    var thumb = c.thumbnail_path
                        ? '<div class="tile-img" style="background-image: url(\'' + escapeHtml(c.thumbnail_path) + '\');"></div>'
                        : '<div class="tile-img">no image</div>';
                    var pills = [];
                    if (c.type_description) {
                        var pillClass = c.is_electric === true ? 'pill electric'
                                      : c.is_electric === false ? 'pill diesel'
                                      : 'pill';
                        pills.push('<span class="' + pillClass + '">' + escapeHtml(c.type_description) + '</span>');
                    }
                    if (c.max_speed_kph) pills.push('<span class="pill">' + Math.round(c.max_speed_kph) + ' kph</span>');
                    if (c.max_power_kw) pills.push('<span class="pill">' + Math.round(c.max_power_kw) + ' kW</span>');
                    var meta = [
                        pills.join(''),
                        c.engine_description ? escapeHtml(c.engine_description) : '',
                        c.manufacturer_name ? '<em style="color: var(--text-muted);">' + escapeHtml(c.manufacturer_name) + '</em>' : ''
                    ].filter(Boolean).join('<br>');
                    return '<div class="tile"><a href="/train-classes/' + c.id + '">' +
                        thumb +
                        '<div class="tile-body">' +
                          '<div class="tile-name">' + escapeHtml(c.name) + '</div>' +
                          '<div class="tile-meta">' + meta + '</div>' +
                        '</div>' +
                    '</a></div>';
                }).join('');
            } catch (e) {
                resultCount.textContent = 'Error: ' + e.message;
            }
        }

        function renderPagination(pag) {
            if (!pag || pag.totalPages <= 1) return;
            var html = '';
            html += '<button ' + (pag.page <= 1 ? 'disabled' : '') + ' data-page="' + (pag.page - 1) + '">&laquo; Prev</button>';
            // Window the page list around current to keep the bar small.
            var pages = [];
            var start = Math.max(1, pag.page - 2);
            var end = Math.min(pag.totalPages, pag.page + 2);
            if (start > 1) { pages.push(1); if (start > 2) pages.push('…'); }
            for (var i = start; i <= end; i++) pages.push(i);
            if (end < pag.totalPages) { if (end < pag.totalPages - 1) pages.push('…'); pages.push(pag.totalPages); }
            pages.forEach(function(p) {
                if (p === '…') {
                    html += '<span class="pagination-info">…</span>';
                } else {
                    html += '<button class="' + (p === pag.page ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
                }
            });
            html += '<button ' + (pag.page >= pag.totalPages ? 'disabled' : '') + ' data-page="' + (pag.page + 1) + '">Next &raquo;</button>';
            pagination.innerHTML = html;
            pagination.querySelectorAll('button[data-page]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var p = parseInt(this.dataset.page, 10);
                    if (!isNaN(p)) loadClasses(p);
                });
            });
        }

        async function populateFilters() {
            // Routes
            try {
                var r = await fetch('/api/routes');
                if (r.ok) {
                    var routes = await r.json();
                    routes.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
                    routes.forEach(function(rt) {
                        var opt = document.createElement('option');
                        opt.value = rt.id;
                        opt.textContent = rt.name;
                        routeSelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Countries
            try {
                var c = await fetch('/api/countries');
                if (c.ok) {
                    var countries = await c.json();
                    countries.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
                    countries.forEach(function(co) {
                        var opt = document.createElement('option');
                        opt.value = co.id;
                        opt.textContent = co.name;
                        countrySelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Voltages
            try {
                var v = await fetch('/api/train-classes/voltages');
                if (v.ok) {
                    var volts = await v.json();
                    volts.forEach(function(n) {
                        var opt = document.createElement('option');
                        opt.value = n;
                        opt.textContent = n >= 1000 ? (n / 1000) + ' kV' : (n + ' V');
                        voltageSelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
            // Types (type_description values)
            try {
                var t = await fetch('/api/train-classes/types');
                if (t.ok) {
                    var types = await t.json();
                    types.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        typeSelect.appendChild(opt);
                    });
                }
            } catch (e) { /* ignore */ }
        }

        searchBtn.addEventListener('click', function() { loadClasses(1); });
        clearBtn.addEventListener('click', function() {
            qInput.value = '';
            qDropdown.style.display = 'none';
            routeSelect.value = '';
            countrySelect.value = '';
            typeSelect.value = '';
            voltageSelect.value = '';
            loadClasses(1);
        });

        refreshBtn.addEventListener('click', async function() {
            refreshBtn.disabled = true;
            refreshStatus.textContent = 'Refreshing class metadata from catalog…';
            try {
                var res = await fetch('/api/train-classes/refresh-metadata', { method: 'POST' });
                if (!res.ok) {
                    refreshStatus.textContent = 'Refresh failed: ' + await res.text();
                    return;
                }
                var d = await res.json();
                refreshStatus.textContent = d.classes_with_metadata + ' / ' + d.classes_total +
                    ' classes updated, ' + d.thumbnail_paths_set + ' thumbnail paths set, ' +
                    d.electrification_rows + ' electrification entries.';
                await loadClasses();
            } catch (e) {
                refreshStatus.textContent = 'Error: ' + e.message;
            } finally {
                refreshBtn.disabled = false;
            }
        });

        (async function() {
            await populateFilters();
            await loadClasses();
        })();
    </script>
</body>
</html>

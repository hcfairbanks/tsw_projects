<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Class - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-color); align-items: center; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: bold; color: var(--accent-color); width: 180px; flex-shrink: 0; }
        .detail-value { color: var(--text-primary); margin-left: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-tertiary); color: var(--accent-color); }
        tr:hover { background: var(--bg-primary); }
        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
        .class-hero { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
        .class-hero-img { width: 522px; max-width: 100%; aspect-ratio: 522 / 208; background: var(--bg-tertiary) center / cover no-repeat; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; }
        .class-hero-meta { flex: 1; min-width: 280px; }
        .class-hero-pills { margin-bottom: 12px; }
        .class-hero-pills .pill { display: inline-block; padding: 2px 9px; border-radius: 3px; background: var(--bg-tertiary); color: var(--text-secondary); margin-right: 6px; font-size: 13px; }
        .class-hero-pills .pill.electric { background: rgba(40, 120, 230, 0.18); color: #5aa0ff; }
        .class-hero-pills .pill.diesel { background: rgba(200, 80, 0, 0.18); color: #ffaa66; }
        .back-link { margin-bottom: 20px; }
        .back-link a { color: var(--accent-color); text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
        a { color: var(--accent-color); }
    </style>
</head>
<body data-theme="dark">
    <h1 id="pageTitle">Train Class</h1>
    <div class="subtitle" id="pageSubtitle"></div>

    <nav id="main-nav"></nav>
    <div id="backLink" class="back-link"></div>

    <div class="card">
        <h2 data-i18n="formations.classDetails">Class Details</h2>
        <div id="classDetails">
            <p class="empty-message">Loading...</p>
        </div>
    </div>

    <div class="card">
        <h2 data-i18n="formations.formationsInClass">Formations</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 0;" data-i18n="formations.formationsHint">Each row below is a physical formation belonging to this class.</p>
        <div id="formationsList">
            <p class="empty-message">Loading...</p>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        const classId = window.location.pathname.split('/').pop();
        const urlParams = new URLSearchParams(window.location.search);
        const fromRouteId = urlParams.get('from_route');

        async function loadClass() {
            try {
                const response = await fetch('/api/train-classes/' + classId);
                if (!response.ok) {
                    document.getElementById('classDetails').innerHTML = '<p class="empty-message">Train class not found.</p>';
                    return;
                }
                const data = await response.json();
                renderClass(data.class || {}, data.electrification || []);
                renderFormations(data.formations || []);
            } catch (error) {
                console.error('Error loading class:', error);
                document.getElementById('classDetails').innerHTML = '<p class="empty-message">Error loading class.</p>';
            }
        }

        function renderClass(c, elec) {
            document.getElementById('pageTitle').textContent = c.name || 'Train Class';
            document.title = (c.name || 'Train Class') + ' - TSW HUD Project';

            var idLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.id') : 'ID';
            var nameLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.name') : 'Name';
            var liveryLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('formations.livery') : 'Livery';
            var lengthLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('formations.typicalLength') : 'Typical Length';
            var carCountLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('formations.typicalCarCount') : 'Typical Car Count';
            var categoryLabel = 'Category';
            var manufacturerLabel = 'Manufacturer';
            var engineLabel = 'Engine';
            var typeLabel = 'Type';
            var maxSpeedLabel = 'Max Speed';
            var maxPowerLabel = 'Max Power';

            // Hero block: thumbnail + propulsion / speed / power pills.
            var thumb = c.thumbnail_path
                ? '<div class="class-hero-img" style="background-image: url(\'' + escapeHtml(c.thumbnail_path) + '\');"></div>'
                : '<div class="class-hero-img">no image</div>';
            var pills = [];
            if (c.is_electric === true) pills.push('<span class="pill electric">Electric</span>');
            else if (c.is_electric === false) pills.push('<span class="pill diesel">Non-electric</span>');
            if (c.max_speed_kph) pills.push('<span class="pill">' + Math.round(c.max_speed_kph) + ' kph max</span>');
            if (c.max_power_kw) pills.push('<span class="pill">' + Math.round(c.max_power_kw) + ' kW</span>');
            if (c.vehicle_category) pills.push('<span class="pill">' + escapeHtml(c.vehicle_category.replace(/([A-Z])/g, ' $1').trim()) + '</span>');

            var hero = '<div class="class-hero">' + thumb +
                '<div class="class-hero-meta">' +
                  '<div class="class-hero-pills">' + pills.join('') + '</div>';
            if (c.engine_description) hero += '<div style="color: var(--text-secondary); margin-bottom: 6px;">' + escapeHtml(c.engine_description) + '</div>';
            if (c.manufacturer_name) hero += '<div style="color: var(--text-muted); font-style: italic; font-size: 13px;">' + escapeHtml(c.manufacturer_name) + '</div>';
            hero += '</div></div>';

            var html = hero;
            html += row(idLabel, c.id);
            html += row(nameLabel, c.name);
            if (c.livery_id) html += row(liveryLabel, c.livery_id);
            if (c.vehicle_category) html += row(categoryLabel, c.vehicle_category.replace(/([A-Z])/g, ' $1').trim());
            if (c.type_description) html += row(typeLabel, c.type_description);
            if (c.engine_description) html += row(engineLabel, c.engine_description);
            if (c.manufacturer_name) html += row(manufacturerLabel, c.manufacturer_name);
            if (c.max_speed_kph) html += row(maxSpeedLabel, Math.round(c.max_speed_kph) + ' kph');
            if (c.max_power_kw) html += row(maxPowerLabel, Math.round(c.max_power_kw) + ' kW');
            if (c.typical_length_m != null) html += row(lengthLabel, c.typical_length_m.toFixed(1) + ' m');
            if (c.typical_car_count != null) html += row(carCountLabel, c.typical_car_count);

            // Electrification list (only meaningful on electric classes).
            if (elec && elec.length > 0) {
                html += '<div class="detail-row" style="align-items: flex-start;"><span class="detail-label">Electrification:</span><span class="detail-value">';
                html += elec.map(function(e) {
                    var v = e.voltage_v ? (e.voltage_v >= 1000 ? (e.voltage_v / 1000) + ' kV' : (e.voltage_v + ' V')) : '';
                    var f = e.frequency_hz ? (e.frequency_hz + ' Hz') : (e.voltage_v ? 'DC' : '');
                    var sys = e.current ? e.current.replace(/([A-Z])/g, ' $1').trim() : '';
                    return [v, f, sys].filter(Boolean).join(' · ');
                }).join('<br>');
                html += '</span></div>';
            }

            document.getElementById('classDetails').innerHTML = html;
        }

        function row(label, value) {
            if (value == null || value === '') return '';
            return '<div class="detail-row"><span class="detail-label">' + label + ':</span><span class="detail-value">' + escapeHtml(String(value)) + '</span></div>';
        }

        function renderFormations(formations) {
            var container = document.getElementById('formationsList');
            if (!formations.length) {
                container.innerHTML = '<p class="empty-message">No formations recorded for this class yet.</p>';
                return;
            }
            var idHeader = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.id') : 'ID';
            var nameHeader = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.name') : 'Name';
            var lengthHeader = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('formations.length') : 'Length';
            var carsHeader = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('formations.cars') : 'Cars';

            var routeQS = fromRouteId ? ('?from_route=' + fromRouteId) : '';
            var html = '<table><thead><tr><th>' + idHeader + '</th><th>' + nameHeader + '</th><th>' + lengthHeader + '</th><th>' + carsHeader + '</th></tr></thead><tbody>';
            formations.forEach(function(f) {
                html += '<tr>';
                html += '<td>' + f.id + '</td>';
                html += '<td><a href="/formations/' + f.id + routeQS + '">' + escapeHtml(f.name) + '</a></td>';
                html += '<td>' + (f.length_m != null ? f.length_m.toFixed(1) + ' m' : '-') + '</td>';
                html += '<td>' + (f.car_count != null ? f.car_count : '-') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', theme);
            var colorScheme = localStorage.getItem('colorScheme');
            if (colorScheme && colorScheme !== 'default') {
                document.body.setAttribute('data-color-scheme', colorScheme);
            }
        })();

        // Build the "← Back to <Route Name>" link AFTER i18n has loaded the
        // locale, otherwise i18n.t('common.backTo') returns the literal key
        // ("common.backTo") since the JSON hasn't been fetched yet — the
        // user-visible bug we're fixing here.
        function renderBackLink() {
            if (!fromRouteId) return Promise.resolve();
            return fetch('/api/routes/' + fromRouteId)
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(route) {
                    if (!route) return;
                    var backToLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.backTo') : 'Back to';
                    document.getElementById('backLink').innerHTML = '<a href="/routes/' + route.id + '">&larr; ' + backToLabel + ' ' + escapeHtml(route.name) + '</a>';
                })
                .catch(function() { /* ignore */ });
        }

        if (typeof i18n !== 'undefined' && i18n.init) {
            i18n.init().then(function() {
                renderBackLink();
                loadClass();
            });
        } else {
            renderBackLink();
            loadClass();
        }
    </script>
    <script src="/js/navbar.js"></script>
</body>
</html>

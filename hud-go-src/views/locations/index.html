<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations - TSW HUD Project</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <script src="/js/theme-loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 30px; }
        .card { background: var(--bg-secondary); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-color); }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: var(--btn-primary-bg); color: #fff; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--btn-danger-bg); color: #fff; }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--bg-tertiary); color: var(--accent-color); padding: 12px; text-align: left; border-bottom: 2px solid var(--border-color); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
        tr:hover { background: var(--bg-tertiary); }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--accent-color); }
        .empty-message { text-align: center; color: var(--text-muted); padding: 40px 20px; font-style: italic; }
        .typeahead-container { position: relative; flex: 1; min-width: 200px; }
        .typeahead-container input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
        .typeahead-container input:focus { outline: none; border-color: var(--accent-color); }
        .typeahead-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 1001; }
        .typeahead-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .typeahead-item:last-child { border-bottom: none; }
        .typeahead-item:hover, .typeahead-item.highlighted { background: var(--bg-tertiary); }
        #editForm { display: none; }
        #editForm.active { display: block; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button { min-width: 40px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination-info { color: var(--text-muted); font-size: 14px; }
        .per-page { display: flex; align-items: center; gap: 8px; }
        .per-page select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }
    </style>
</head>
<body>
    <h1 data-i18n="locations.title">Locations</h1>
    <nav id="main-nav"></nav>

    <!-- Add Location Form -->
    <div class="card">
        <h2 data-i18n="locations.addNew">Add New Location</h2>
        <form id="addForm" onsubmit="addLocation(event)">
            <div class="form-row">
                <div class="form-group">
                    <label data-i18n="locations.route">Route</label>
                    <div class="typeahead-container">
                        <input type="text" id="addRouteSearch" autocomplete="off" data-i18n-placeholder="locations.selectRoute" placeholder="Type to search routes...">
                        <div class="typeahead-dropdown" id="addRouteDropdown"></div>
                        <input type="hidden" id="addRouteId">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="locations.locationName">Location Name</label>
                    <input type="text" id="addName" required data-i18n-placeholder="locations.locationNamePlaceholder" placeholder="e.g., London Euston">
                </div>
                <div class="form-group" style="flex: 0;">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn-primary" data-i18n="locations.addLocation">Add Location</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Edit Location Form -->
    <div class="card" id="editForm">
        <h2 data-i18n="locations.editLocation">Edit Location</h2>
        <form onsubmit="saveEdit(event)">
            <div class="form-row">
                <div class="form-group">
                    <label data-i18n="locations.locationName">Location Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group" style="flex: 0;">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn-primary" data-i18n="common.save">Save</button>
                    <button type="button" class="btn-secondary" onclick="cancelEdit()" data-i18n="common.cancel">Cancel</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Location List -->
    <div class="card">
        <h2 data-i18n="locations.title">Locations</h2>
        <div class="search-box">
            <input type="text" id="searchInput" data-i18n-placeholder="locations.searchPlaceholder" placeholder="Type to search locations..." oninput="currentPage = 1; applyFilters(1)">
            <div class="typeahead-container">
                <input type="text" id="filterRouteSearch" autocomplete="off" data-i18n-placeholder="locations.allRoutes" placeholder="Filter by route...">
                <div class="typeahead-dropdown" id="filterRouteDropdown"></div>
                <input type="hidden" id="filterRoute">
            </div>
            <button class="btn-secondary" onclick="clearSearch()" data-i18n="common.clear">Clear</button>
        </div>
        <div id="locationList"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        var allLocations = [];
        var allRoutes = [];
        var editingId = null;
        var addRouteHighlight = -1;
        var filterRouteHighlight = -1;
        var selectedAddRouteId = null;
        var selectedFilterRouteId = '';
        var currentPage = 1;
        var currentLimit = 10;

        function t(key, fallback) {
            return (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fallback;
        }

        async function loadRoutes() {
            try {
                var res = await fetch('/api/routes');
                allRoutes = await res.json();
                // Handle paginated response
                if (allRoutes.data) allRoutes = allRoutes.data;
                setupRouteTypeaheads();
            } catch (err) {
                console.error('Failed to load routes:', err);
            }
        }

        function filterRoutes(query) {
            if (!query) return allRoutes.slice(0, 20);
            var lq = query.toLowerCase();
            return allRoutes.filter(function(r) {
                return r.name.toLowerCase().includes(lq);
            }).slice(0, 20);
        }

        function showRouteDropdown(inputId, dropdownId, highlightIdx, query, onSelect) {
            var dropdown = document.getElementById(dropdownId);
            var filtered = filterRoutes(query);

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="typeahead-item" style="color: var(--text-muted);">' + t('routes.noRoutes', 'No routes found') + '</div>';
            } else {
                dropdown.innerHTML = filtered.map(function(route, index) {
                    return '<div class="typeahead-item' + (index === highlightIdx ? ' highlighted' : '') + '" data-id="' + route.id + '" data-name="' + escapeHtml(route.name) + '">' + escapeHtml(route.name) + '</div>';
                }).join('');

                dropdown.querySelectorAll('.typeahead-item[data-id]').forEach(function(item) {
                    item.addEventListener('click', function() {
                        onSelect(parseInt(item.dataset.id), item.dataset.name);
                    });
                });
            }
            dropdown.style.display = 'block';
        }

        function updateHighlight(dropdown, index) {
            var items = dropdown.querySelectorAll('.typeahead-item[data-id]');
            items.forEach(function(item, idx) {
                item.classList.toggle('highlighted', idx === index);
            });
            if (index >= 0 && items[index]) {
                items[index].scrollIntoView({ block: 'nearest' });
            }
        }

        function setupRouteTypeaheads() {
            // Add route typeahead
            var addInput = document.getElementById('addRouteSearch');
            var addDropdown = document.getElementById('addRouteDropdown');

            addInput.addEventListener('focus', function() {
                addRouteHighlight = -1;
                showRouteDropdown('addRouteSearch', 'addRouteDropdown', addRouteHighlight, addInput.value.trim(), selectAddRoute);
            });
            addInput.addEventListener('input', function() {
                addRouteHighlight = -1;
                selectedAddRouteId = null;
                document.getElementById('addRouteId').value = '';
                showRouteDropdown('addRouteSearch', 'addRouteDropdown', addRouteHighlight, addInput.value.trim(), selectAddRoute);
            });
            addInput.addEventListener('keydown', function(e) {
                var items = addDropdown.querySelectorAll('.typeahead-item[data-id]');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    addRouteHighlight = Math.min(addRouteHighlight + 1, items.length - 1);
                    updateHighlight(addDropdown, addRouteHighlight);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    addRouteHighlight = Math.max(addRouteHighlight - 1, 0);
                    updateHighlight(addDropdown, addRouteHighlight);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (addRouteHighlight >= 0 && items[addRouteHighlight]) {
                        items[addRouteHighlight].click();
                    }
                } else if (e.key === 'Escape') {
                    addDropdown.style.display = 'none';
                }
            });

            // Filter route typeahead
            var filterInput = document.getElementById('filterRouteSearch');
            var filterDropdown = document.getElementById('filterRouteDropdown');

            filterInput.addEventListener('focus', function() {
                filterRouteHighlight = -1;
                showRouteDropdown('filterRouteSearch', 'filterRouteDropdown', filterRouteHighlight, filterInput.value.trim(), selectFilterRoute);
            });
            filterInput.addEventListener('input', function() {
                filterRouteHighlight = -1;
                selectedFilterRouteId = '';
                document.getElementById('filterRoute').value = '';
                showRouteDropdown('filterRouteSearch', 'filterRouteDropdown', filterRouteHighlight, filterInput.value.trim(), selectFilterRoute);
                currentPage = 1;
                applyFilters(1);
            });
            filterInput.addEventListener('keydown', function(e) {
                var items = filterDropdown.querySelectorAll('.typeahead-item[data-id]');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    filterRouteHighlight = Math.min(filterRouteHighlight + 1, items.length - 1);
                    updateHighlight(filterDropdown, filterRouteHighlight);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    filterRouteHighlight = Math.max(filterRouteHighlight - 1, 0);
                    updateHighlight(filterDropdown, filterRouteHighlight);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (filterRouteHighlight >= 0 && items[filterRouteHighlight]) {
                        items[filterRouteHighlight].click();
                    }
                } else if (e.key === 'Escape') {
                    filterDropdown.style.display = 'none';
                }
            });

            // Close dropdowns on click outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.typeahead-container')) {
                    addDropdown.style.display = 'none';
                    filterDropdown.style.display = 'none';
                }
            });
        }

        function selectAddRoute(id, name) {
            selectedAddRouteId = id;
            document.getElementById('addRouteId').value = id;
            document.getElementById('addRouteSearch').value = name;
            document.getElementById('addRouteDropdown').style.display = 'none';
            addRouteHighlight = -1;
        }

        function selectFilterRoute(id, name) {
            selectedFilterRouteId = id;
            document.getElementById('filterRoute').value = id;
            document.getElementById('filterRouteSearch').value = name;
            document.getElementById('filterRouteDropdown').style.display = 'none';
            filterRouteHighlight = -1;
            currentPage = 1;
            applyFilters(1);
        }

        async function loadAllLocations() {
            allLocations = [];
            for (var i = 0; i < allRoutes.length; i++) {
                try {
                    var res = await fetch('/api/routes/' + allRoutes[i].id + '/locations');
                    var locs = await res.json();
                    locs.forEach(function(loc) {
                        loc.route_name = allRoutes[i].name;
                    });
                    allLocations = allLocations.concat(locs);
                } catch (err) {
                    // skip
                }
            }
            applyFilters();
        }

        function applyFilters(page) {
            var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            var routeId = document.getElementById('filterRoute').value;

            var filtered = allLocations.filter(function(loc) {
                if (routeId && loc.route_id != routeId) return false;
                if (search && !loc.name.toLowerCase().includes(search)) return false;
                return true;
            });

            page = page || currentPage;
            currentPage = page;

            var total = filtered.length;
            var totalPages = Math.ceil(total / currentLimit);
            if (currentPage > totalPages) currentPage = totalPages || 1;

            var start = (currentPage - 1) * currentLimit;
            var paginated = filtered.slice(start, start + currentLimit);

            renderLocations(paginated);
            renderPagination(total, totalPages);
        }

        function renderLocations(locations) {
            var container = document.getElementById('locationList');

            if (locations.length === 0) {
                container.innerHTML = '<p class="empty-message" data-i18n="locations.noLocations">' + t('locations.noLocations', 'No locations found.') + '</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            var html = '<table><thead><tr>';
            html += '<th>ID</th>';
            html += '<th data-i18n="locations.locationName">' + t('locations.locationName', 'Location Name') + '</th>';
            html += '<th data-i18n="locations.route">' + t('locations.route', 'Route') + '</th>';
            html += '<th data-i18n="common.actions">' + t('common.actions', 'Actions') + '</th>';
            html += '</tr></thead><tbody>';

            locations.forEach(function(loc) {
                html += '<tr>';
                html += '<td>' + loc.id + '</td>';
                html += '<td>' + escapeHtml(loc.name) + '</td>';
                html += '<td>' + escapeHtml(loc.route_name || '') + '</td>';
                html += '<td>';
                html += '<button class="btn-secondary" onclick="editLocation(' + loc.id + ', \'' + escapeJs(loc.name) + '\')" data-i18n="common.edit">' + t('common.edit', 'Edit') + '</button> ';
                html += '<button class="btn-danger" onclick="deleteLocation(' + loc.id + ', \'' + escapeJs(loc.name) + '\')" data-i18n="common.delete">' + t('common.delete', 'Delete') + '</button>';
                html += '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderPagination(total, totalPages) {
            var container = document.getElementById('pagination');
            var ofText = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.of') : 'of';
            var showingText = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('common.showing') : 'Showing';
            if (totalPages <= 1) {
                container.innerHTML = '<span class="pagination-info">' + showingText + ' ' + total + ' locations</span>';
                return;
            }

            var html = '<button class="btn-secondary" onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>&laquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>&lsaquo;</button>';
            html += '<span class="pagination-info">' + currentPage + ' ' + ofText + ' ' + totalPages + '</span>';
            html += '<button class="btn-secondary" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&rsaquo;</button>';
            html += '<button class="btn-secondary" onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>&raquo;</button>';
            html += '<div class="per-page"><select onchange="changeLimit(this.value)">';
            [10, 25, 50, 100].forEach(function(n) {
                html += '<option value="' + n + '" ' + (currentLimit === n ? 'selected' : '') + '>' + n + '</option>';
            });
            html += '</select></div>';
            container.innerHTML = html;
        }

        function goToPage(page) {
            applyFilters(page);
        }

        function changeLimit(limit) {
            currentLimit = parseInt(limit);
            currentPage = 1;
            applyFilters(1);
        }

        async function addLocation(e) {
            e.preventDefault();
            var routeId = document.getElementById('addRouteId').value;
            var name = document.getElementById('addName').value.trim();
            if (!routeId || !name) return;

            try {
                var res = await fetch('/api/locations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route_id: parseInt(routeId), name: name })
                });
                if (res.ok) {
                    document.getElementById('addName').value = '';
                    document.getElementById('addRouteSearch').value = '';
                    document.getElementById('addRouteId').value = '';
                    selectedAddRouteId = null;
                    await loadAllLocations();
                }
            } catch (err) {
                console.error('Failed to add location:', err);
            }
        }

        function editLocation(id, name) {
            editingId = id;
            document.getElementById('editName').value = name;
            document.getElementById('editForm').classList.add('active');
            document.getElementById('editName').focus();
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('editForm').classList.remove('active');
        }

        async function saveEdit(e) {
            e.preventDefault();
            if (!editingId) return;
            var name = document.getElementById('editName').value.trim();
            if (!name) return;

            try {
                await fetch('/api/locations/' + editingId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                cancelEdit();
                await loadAllLocations();
            } catch (err) {
                console.error('Failed to update location:', err);
            }
        }

        async function deleteLocation(id, name) {
            var msg = t('locations.confirmDelete', 'Are you sure you want to delete this location?');
            if (!confirm(msg + '\n\n' + name)) return;

            try {
                await fetch('/api/locations/' + id, { method: 'DELETE' });
                await loadAllLocations();
            } catch (err) {
                console.error('Failed to delete location:', err);
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterRouteSearch').value = '';
            document.getElementById('filterRoute').value = '';
            selectedFilterRouteId = '';
            currentPage = 1;
            applyFilters(1);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJs(text) {
            if (!text) return '';
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // Re-render dynamic content (including pagination) when language changes
        document.addEventListener('languageChanged', function() {
            applyFilters(currentPage);
        });

        i18n.init().then(function() {
            loadRoutes().then(loadAllLocations);
        });
    </script>
</body>
</html>
